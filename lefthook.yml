# Git hooks. Installed by `pnpm install` (prepare script). Escape hatches:
# `git commit --no-verify`, `LEFTHOOK=0 git push`.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,mjs,json,graphql}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
    eslint:
      glob: 'src/**/*.{ts,tsx}'
      # --no-warn-ignored: ESLint 9 warns (and --max-warnings=0 then fails the
      # hook) when a staged path matches an `ignores` pattern, e.g. the
      # generated src/i18n/locales/**/messages.ts catalogs.
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    typos:
      # --force-exclude: typos.toml's extend-exclude otherwise only governs
      # directory traversal, and naming files explicitly on the command line
      # bypasses it (the translated catalogs are full of Spanish words that look
      # like English typos).
      run: typos --force-exclude {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    knip:
      run: pnpm knip
    unit:
      run: pnpm test -- --changedSince=origin/main --passWithNoTests
# Both hooks pass git's own arguments straight through: the script works out
# which two revisions to compare (lefthook's `{1}` templating expanded inside
# `HEAD@{1}`, which made git reject `HEAD@0` on every merge).
post-merge:
  commands:
    install:
      run: bash scripts/hooks/install-if-lockfile-changed.sh post-merge {1}
post-checkout:
  commands:
    install:
      run: bash scripts/hooks/install-if-lockfile-changed.sh post-checkout {1} {2} {3}
