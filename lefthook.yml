# Git hooks. Installed by `pnpm install` (prepare script). Escape hatches:
# `git commit --no-verify`, `LEFTHOOK=0 git push`.
pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,mjs,json,graphql}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
    eslint:
      glob: 'src/**/*.{ts,tsx}'
      # --no-warn-ignored: ESLint 9 warns (and --max-warnings=0 then fails the
      # hook) when a staged path matches an `ignores` pattern, e.g. the
      # generated src/i18n/locales/**/messages.ts catalogs.
      run: pnpm exec eslint --max-warnings=0 --no-warn-ignored {staged_files}
    typos:
      # typos.toml's extend-exclude only governs directory traversal; naming files
      # explicitly bypasses it, so the same exclusions are repeated here (the
      # translated catalogs are full of words that look like English typos).
      exclude:
        - 'pnpm-lock.yaml'
        - '*.po'
        - 'src/i18n/locales/**'
        - 'src/graphql/generated/**'
      run: typos {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    knip:
      run: pnpm knip
    unit:
      run: pnpm test -- --changedSince=origin/main --passWithNoTests
post-merge:
  commands:
    install:
      run: git diff --name-only HEAD@{1} HEAD | grep -q pnpm-lock.yaml && pnpm install --frozen-lockfile || true
post-checkout:
  commands:
    install:
      run: git diff --name-only {1} {2} | grep -q pnpm-lock.yaml && pnpm install --frozen-lockfile || true
