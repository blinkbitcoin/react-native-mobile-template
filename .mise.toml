# Tool versions for humans and CI (jdx/mise-action reads this file).
# Node/pnpm/java/ruby are what the app, Metro, Gradle and fastlane need;
# the rest are linters used by `make check`.
[tools]
node = "24"
pnpm = "12"
java = "temurin-17"
ruby = "3.3"
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Pinned, not "latest": shared-workflows pins the same version, so the two
# repos can never disagree about what counts as a typo.
typos = "1.50.1"
# Same pins as shared-workflows (packages/dev-config/versions.json).
zizmor = "1.30.1"
gitleaks = "8.30.1"
# Security scanners. Pinned for the same reason as the linters above: CI and a
# laptop must agree about what counts as a finding.
osv-scanner = "2.6.0"
semgrep = "1.177.0"

[env]
# Expo telemetry off everywhere. ANDROID_HOME is deliberately not set here: it is
# machine-specific, so it lives in .env.local (written by `make setup-android`)
# and `make doctor` checks it is set.
EXPO_NO_TELEMETRY = "1"
# A UTF-8 locale when the shell sets none: without it Ruby reads source as
# US-ASCII, so `make check-release` dies on fastlane/lanes/shared.rb ("invalid
# multibyte char") and CocoaPods refuses to run. A LANG you set wins.
LANG = "{{ env.LANG | default(value='en_US.UTF-8') }}"
# Per-machine overrides, gitignored by the `.env*.local` rule. Absent by
# default, and mise is happy when the file does not exist. It comes first:
# mise evaluates these directives top to bottom, and `_.path` below reads
# ANDROID_HOME from it.
_.file = [".env.local"]
# Locally installed CLIs (biome, eslint, expo, ...) on PATH, so they run without
# a `pnpm exec` prefix. This is the useful half of a direnv `.envrc`; see
# docs/decisions/0007-mise-not-nix.md.
#
# The rest of `_.path` is the native toolchain `make setup` installs: the
# Android SDK's tools from ANDROID_HOME (which `make setup-android` records in
# .env.local, loaded above) and Maestro's install directory. An unset ANDROID_HOME leaves a
# harmless /platform-tools entry that matches nothing.
_.path = [
  "node_modules/.bin",
  "{{ env.ANDROID_HOME | default(value='') }}/platform-tools",
  "{{ env.ANDROID_HOME | default(value='') }}/emulator",
  "{{ env.ANDROID_HOME | default(value='') }}/cmdline-tools/latest/bin",
  "{{ env.HOME }}/.maestro/bin",
]

# The one port knob, so `APP_PORT_BASE=8090` in a second worktree moves Metro,
# the mock API and the web preview together. Declared here (after `_.file`, so a
# per-machine .env.local can set it) purely to give the variable a default and a
# visible home. The *derived* ports are deliberately NOT mirrored here: they
# have one producer, `scripts/ports.mjs`, which the Makefile's run targets eval.
# A mirror would sit in the environment as a concrete METRO_PORT=8081, which the
# helper cannot tell from a deliberate per-service override — and the base would
# then silently stop working. scripts/ports.test.mjs asserts the three service
# variables never come back here.
APP_PORT_BASE = "{{ env.APP_PORT_BASE | default(value='8080') }}"
