<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Create the Connect API client. Users and permissions, API key, Connect API. The agent names the client, keeps Project at N/A so the client is team level, and limits the roles; the human clicks Create because the client secret is shown exactly once. Both strings go to the local validator and then to GitHub on stdin.">
<rect width="100%" height="100%" fill="#f6f5f1"/>
<rect x="1" y="1" width="518" height="328" rx="6" style="fill:#f6f5f1;stroke:currentColor" stroke-width="1.2"/>
<rect x="1" y="1" width="518" height="34" rx="6" style="fill:#edebe5"/>
<text x="16" y="23" font-size="12" fill="currentColor" font-weight="500">AppGallery Connect  &#8250;  Users and permissions  ›  API key  ›  Connect API</text>
<rect x="1" y="35" width="150" height="294" style="fill:#edebe5" opacity="0.7"/>
<text x="16" y="60" font-size="11.5" style="fill:#5f6570">My projects</text>
<text x="16" y="86" font-size="11.5" style="fill:#5f6570">My apps</text>
<rect x="8" y="97" width="136" height="22" rx="3" style="fill:#f6e3de;stroke:#a3402e" stroke-width="1"/>
<text x="16" y="112" font-size="11.5" fill="currentColor" font-weight="500">Users and permissions</text>
<text x="16" y="138" font-size="11.5" style="fill:#5f6570">Reports</text>
<text x="16" y="164" font-size="11.5" style="fill:#5f6570">Services</text>
<text x="170" y="62" font-size="11" style="fill:#5f6570">Name</text>
<rect x="170" y="67" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1"/>
<text x="178" y="83" font-size="11.5" fill="currentColor">react-native-mobile-template release</text>
<text x="170" y="102" font-size="11" style="fill:#5f6570">Project</text>
<rect x="170" y="107" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1"/>
<text x="178" y="123" font-size="11.5" fill="currentColor">N/A (team level)</text>
<path d="M488 116 l4 5 l4 -5" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="170" y="142" font-size="11" style="fill:#5f6570">Roles</text>
<rect x="170" y="147" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1"/>
<text x="178" y="163" font-size="11.5" fill="currentColor">App administrator for this app</text>
<path d="M488 156 l4 5 l4 -5" fill="none" stroke="currentColor" stroke-width="1.2"/>
<text x="170" y="182" font-size="11" style="fill:#5f6570">Client ID (shown once)</text>
<rect x="170" y="187" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178" y="203" font-size="11.5" fill="currentColor">becomes HUAWEI_CLIENT_ID</text>
<text x="170" y="222" font-size="11" style="fill:#5f6570">Client Secret (shown once)</text>
<rect x="170" y="227" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178" y="243" font-size="11.5" fill="currentColor">becomes HUAWEI_CLIENT_SECRET, paste to the validator</text>
<rect x="170" y="282" width="150" height="32" rx="3" style="fill:#f8ecd9;stroke:#b5711c" stroke-width="1"/>
<text x="176" y="295" font-size="11" fill="currentColor">agent fills the form</text>
<text x="176" y="309" font-size="11" fill="currentColor">human clicks Create</text>
<rect x="380" y="284" width="120" height="28" rx="4" style="fill:#f8ecd9;stroke:#b5711c" stroke-width="2" stroke-dasharray="5 3"/>
<text x="440" y="302" font-size="12" text-anchor="middle" font-weight="500" fill="currentColor">Create</text>
</svg>
