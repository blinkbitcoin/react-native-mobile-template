<rect x="170" y="107" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1"/>
<text x="178" y="123" font-size="11.5" fill="currentColor">from the release, 10 to 300 characters</text>
