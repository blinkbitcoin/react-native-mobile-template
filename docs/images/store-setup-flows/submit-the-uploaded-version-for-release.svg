<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Submit the uploaded version for release. My apps, Distribute, Version information. What the upload_huawei lane does on the production dispatch: the same signed bundle, the release notes and a submit for review. This screen is where a human checks the state afterwards; the lane does the clicking.">
