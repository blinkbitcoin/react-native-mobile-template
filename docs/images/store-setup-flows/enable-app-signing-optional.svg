<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Enable App Signing (optional). My apps, Services, App Signing. Optional and permanent: once enabled Huawei re-signs every bundle for this application. The template signs with its own upload key, so the default is to leave this off; the agent only proceeds on a yes.">
