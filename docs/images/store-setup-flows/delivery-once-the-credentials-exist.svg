<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1160 470" role="img" aria-label="Delivery pipeline: a push to main runs CI, Prepare reserves the build tag and waits for green, iOS and Android build and verify, both upload to the internal tracks and publish a pre-release; a release promotes to TestFlight external and Play beta; production sits behind the environment reviewers and is never approved on the template. Huawei AppGallery is an opt-in third store on all three tiers: every push uploads a test version free of manual review, a release re-uploads the bundle from the tag into open testing with manual review, and the production dispatch submits the formal release. AppGallery has one version slot, so each tier replaces the last, and its review queue can skip an upload but never fail the rows above.">
<rect width="100%" height="100%" fill="#f6f5f1"/>
        <defs>
          <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>
        <g font-size="12" fill="currentColor" text-anchor="middle">
          <rect x="20" y="95" width="110" height="46" rx="4" style="fill:#ecebe6;stroke:currentColor" stroke-width="1.2"/>
          <text x="75" y="114">Push to main</text><text x="75" y="130">or release merge</text>
          <rect x="165" y="95" width="120" height="46" rx="4" style="fill:#ecebe6;stroke:currentColor" stroke-width="1.2"/>
          <text x="225" y="114">CI</text><text x="225" y="130">checks, unit, E2E</text>
          <rect x="320" y="95" width="130" height="46" rx="4" style="fill:#ecebe6;stroke:currentColor" stroke-width="1.2"/>
          <text x="385" y="114">Prepare</text><text x="385" y="130">reserve tag, wait green</text>
          <rect x="485" y="40" width="130" height="46" rx="4" style="fill:#e6eaf4;stroke:#3f4f7a" stroke-width="1.5"/>
          <text x="550" y="59">Build iOS, verify</text><text x="550" y="75">signed with match</text>
          <rect x="485" y="150" width="130" height="46" rx="4" style="fill:#e3f0e8;stroke:#2f7a52" stroke-width="1.5"/>
          <text x="550" y="169">Build Android, verify</text><text x="550" y="185">signed with upload key</text>
          <rect x="650" y="40" width="130" height="46" rx="4" style="fill:#e6eaf4;stroke:#3f4f7a" stroke-width="1.5"/>
          <text x="715" y="59">TestFlight internal</text><text x="715" y="75">no review</text>
          <rect x="650" y="150" width="130" height="46" rx="4" style="fill:#e3f0e8;stroke:#2f7a52" stroke-width="1.5"/>
          <text x="715" y="169">Play internal track</text><text x="715" y="185">no review</text>
          <rect x="815" y="95" width="120" height="46" rx="4" style="fill:#ecebe6;stroke:currentColor" stroke-width="1.2"/>
          <text x="875" y="114">Pre-release</text><text x="875" y="130" font-family="IBM Plex Mono, Menlo, monospace" font-size="11">vX.Y.Z-build.N</text>
          <rect x="970" y="40" width="170" height="46" rx="4" style="fill:#e6eaf4;stroke:#3f4f7a" stroke-width="1.5"/>
          <text x="1055" y="59">TestFlight external</text><text x="1055" y="75">Beta App Review, once</text>
          <rect x="970" y="150" width="170" height="46" rx="4" style="fill:#e3f0e8;stroke:#2f7a52" stroke-width="1.5"/>
          <text x="1055" y="169">Play beta track</text><text x="1055" y="185">no review</text>
          <rect x="640" y="230" width="150" height="46" rx="4" style="fill:#f6e3de;stroke:#a3402e" stroke-width="1.5" stroke-dasharray="5 3"/>
          <text x="715" y="249">AppGallery test version</text><text x="715" y="265">no manual review, hours</text>
          <rect x="970" y="230" width="170" height="46" rx="4" style="fill:#f6e3de;stroke:#a3402e" stroke-width="1.5" stroke-dasharray="5 3"/>
          <text x="1055" y="249">AppGallery open testing</text><text x="1055" y="265">manual review, 1 to 3 days</text>
          <rect x="740" y="320" width="400" height="46" rx="4" style="fill:#f6e3de;stroke:#a3402e" stroke-width="1.5" stroke-dasharray="5 3"/>
          <text x="940" y="339">AppGallery formal release: upload from the tag, submit for review</text><text x="940" y="355">opt-in via HUAWEI_UPLOADS_ENABLED; review takes days</text>
          <rect x="740" y="400" width="400" height="46" rx="4" style="fill:#f8ecd9;stroke:#b5711c" stroke-width="2" stroke-dasharray="5 3"/>
          <text x="940" y="419">Production: App Review and Play production rollout</text><text x="940" y="435">behind the environment's reviewers; never approved on the template</text>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#ap)">
          <path d="M130 118 H165"/>
          <path d="M285 118 H320"/>
          <path d="M450 118 C 465 118, 470 63, 485 63"/>
          <path d="M450 118 C 465 118, 470 173, 485 173"/>
          <path d="M615 63 H650"/>
          <path d="M615 173 H650"/>
          <path d="M780 63 C 795 63, 800 118, 815 118"/>
          <path d="M780 173 C 795 173, 800 118, 815 118"/>
          <path d="M935 118 C 950 118, 955 63, 970 63"/>
          <path d="M935 118 C 950 118, 955 173, 970 173"/>
          <path d="M615 173 C 630 173, 625 253, 640 253" stroke-dasharray="4 3"/>
          <path d="M935 118 C 950 118, 955 253, 970 253" stroke-dasharray="4 3"/>
          <path d="M760 276 V320" stroke-dasharray="4 3"/>
          <path d="M1055 276 V320" stroke-dasharray="4 3"/>
          <path d="M1140 173 H1150 V423 H1140" stroke-dasharray="4 3"/>
        </g>
        <g font-size="11" style="fill:#5f6570">
          <text x="140" y="108">every push</text>
          <text x="820" y="160">promote on release</text>
          <text x="985" y="222">re-uploaded from the tag</text>
          <text x="640" y="292">never blocking the rows above</text>
          <text x="768" y="312">one version slot: each tier replaces the last</text>
          <text x="985" y="392">manual dispatch only</text>
        </g>
      </svg>
