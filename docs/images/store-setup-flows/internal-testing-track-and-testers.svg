<text x="16" y="23" font-size="12" fill="currentColor" font-weight="500">App  ›  Test and release  ›  Testing  ›  Internal testing  ›  Testers</text>
<rect x="1" y="35" width="150" height="294" style="fill:#edebe5" opacity="0.7"/>
<text x="16" y="60" font-size="11.5" style="fill:#5f6570">Releases overview</text>
<text x="16" y="86" font-size="11.5" style="fill:#5f6570">Production</text>
<text x="16" y="112" font-size="11.5" style="fill:#5f6570">Testing</text>
