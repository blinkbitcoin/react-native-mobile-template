<text x="16" y="138" font-size="11.5" fill="currentColor" font-weight="500">Internal testing</text>
<text x="16" y="164" font-size="11.5" style="fill:#5f6570">Closed testing</text>
<text x="16" y="190" font-size="11.5" style="fill:#5f6570">Open testing</text>
<text x="170" y="62" font-size="11" style="fill:#5f6570">Email list name</text>
<rect x="170" y="67" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1"/>
<text x="178" y="83" font-size="11.5" fill="currentColor">Internal testers</text>
<text x="170" y="102" font-size="11" style="fill:#5f6570">Add email addresses</text>
<rect x="170" y="107" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178" y="123" font-size="11.5" fill="currentColor">from the human, comma separated</text>
<text x="170" y="142" font-size="11" style="fill:#5f6570">Feedback URL or email</text>
<rect x="170" y="147" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178" y="163" font-size="11.5" fill="currentColor">optional</text>
<text x="170" y="182" font-size="11" style="fill:#5f6570">Release</text>
<rect x="170" y="187" width="330" height="24" rx="3" style="fill:#fbfaf7;stroke:currentColor" stroke-width="1" stroke-dasharray="3 2"/>
<text x="178" y="203" font-size="11.5" fill="currentColor">created by the pipeline on the first push</text>
<rect x="170" y="289" width="185" height="18" rx="3" style="fill:#f8ecd9;stroke:#b5711c" stroke-width="1"/>
<text x="176" y="302" font-size="11" fill="currentColor">agent creates the list only</text>
<rect x="380" y="284" width="120" height="28" rx="4" style="fill:#2f7a52;stroke:#2f7a52" stroke-width="1"/>
<text x="440" y="302" font-size="12" text-anchor="middle" font-weight="500" style="fill:#fbfaf7">Save changes</text>
