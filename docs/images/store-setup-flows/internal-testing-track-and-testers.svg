<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Internal testing track and testers. Test and release, Testing, Internal testing. The agent creates the tester email list from the addresses the human gives and leaves the release itself to the pipeline: the first upload is the delivery workflow's job and is gated.">
<rect width="100%" height="100%" fill="#f6f5f1"/>
<rect x="1" y="1" width="518" height="328" rx="6" style="fill:#f6f5f1;stroke:currentColor" stroke-width="1.2"/>
