<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Create the application record. AppGallery Connect, My apps, New. The agent enters the name from the metadata title, the default language, the category and the package name; the package name fixes what this record can ever publish, so it waits for a yes. The numeric App ID appears under App information afterwards and becomes a repository variable.">
<rect width="100%" height="100%" fill="#f6f5f1"/>
<rect x="1" y="1" width="518" height="328" rx="6" style="fill:#f6f5f1;stroke:currentColor" stroke-width="1.2"/>
<rect x="1" y="1" width="518" height="34" rx="6" style="fill:#edebe5"/>
