<svg xmlns="http://www.w3.org/2000/svg" width="520" height="330" color="#1c1f24" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 520 330" role="img" aria-label="Conceptual screen: Service account and per-application grant. Two consoles. Google Cloud: IAM and Admin, Service Accounts, create, then Keys, Add key, JSON. Play Console: Users and permissions, Invite new users, paste the account email, select this application only, tick the release and store-presence permissions. The agent reads the app-scope choice back before Invite.">
<rect width="100%" height="100%" fill="#f6f5f1"/>
