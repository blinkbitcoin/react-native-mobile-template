# This repository's CodeQL configuration. The suite, the alert-suppression pack
# and the paths nobody scans (ios, android, dist, coverage, vendor/bundle, .expo,
# .workflows, worktrees) are the shared tooling's defaults: both the CI analysis
# (check-code-scanning.yml) and `make check-code-scanning` merge this file over
# them (@blinkbitcoin/app-tooling's README, "resolve-code-scanning-config"). What
# is left here is what only this repository generates.
name: react-native-mobile-template

paths-ignore:
  - src/graphql/generated # graphql-codegen output (`make gen-graphql`)
  - src/i18n/locales/*/messages.ts # compiled Lingui catalogs (`make gen-i18n`)
