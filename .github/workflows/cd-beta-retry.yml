name: CD / Beta Retry
# `cd-beta.yml` refuses to promote until that commit's `cd-internal`
# run is green. When beta is dispatched before internal finishes (or while it is
# red), the beta run fails at the gate and there is nothing to re-trigger it —
# cd-release.yml dispatches it once. This workflow closes that hole: whenever an
# internal run for main concludes successfully, it re-runs the failed jobs of a
# beta run for the same commit, through shared-workflows' publish-retry.yml.
on:
  workflow_run:
    # The workflow's *display name*, not its file name: `workflow_run` matches
    # on `name:`. This listened for "release-internal" after that workflow was
    # renamed "CD / Internal", and never fired again (v0.2.3's beta had to be
    # re-run by hand). scripts/release-workflows.test.mjs pins the pairing.
    workflows: [CD / Internal]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  # Per-sha, and not the shared `release-` group: this is precisely the
  # workflow that must run promptly after an internal run goes green, and the
  # shared group would park it behind the next 60-90 minute build (or evict it
  # outright). It calls no store API.
  group: release-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  # `head-sha` is the internal run's head sha, which is the release commit: the
  # beta run cd-release.yml dispatched at the tag has the same sha. If a beta
  # run was started some other way on a later commit, no run matches and the
  # retry no-ops. That is accepted: the operator can re-run cd-beta by hand,
  # and matching more loosely risks re-running a beta promotion for a
  # different release. The shared script re-runs a run that concluded without
  # success (failed, cancelled, timed out or evicted from a concurrency group),
  # and only its failed jobs, so the promotion picks up where the gate stopped
  # it instead of promoting twice.
  retry-beta:
    name: Retry Beta
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/publish-retry.yml@c731cdcb138fad6769aee5c4e79596ce699c039b # v0.28.0
    permissions:
      contents: read
      # `gh run rerun` writes to the Actions API.
      actions: write
    with:
      workflow: cd-beta.yml
      head-sha: ${{ github.event.workflow_run.head_sha }}
