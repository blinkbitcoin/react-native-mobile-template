name: CI / PR Closed
on:
  pull_request:
    types: [closed]
permissions:
  contents: write # required: pr-closed.yml's badges-cleanup job pushes the gh-pages branch
  actions: write # required: pr-closed.yml's cancel job needs this to cancel runs
jobs:
  pr-closed:
    name: Cleanup
    uses: blinkbitcoin/shared-workflows/.github/workflows/pr-closed.yml@c731cdcb138fad6769aee5c4e79596ce699c039b # v0.28.0
