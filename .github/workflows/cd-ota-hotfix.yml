name: CD / OTA Hotfix
# A JS-only fix, shipped to an already-installed binary without a store review.
# Only for changes that do not move the native fingerprint: the gate in
# `publish-ota.yml` compares this commit's fingerprints against the
# baseline release's `build-info.json` and dies on any mismatch, because an
# update whose JS expects a native module the installed binary lacks crashes on
# launch for every user on the channel and cannot be recalled.
#
# Anything that touches native code is a new store build, not a hotfix.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel to publish to
        type: choice
        required: true
        default: internal
        options: [internal, beta, production]
      ref:
        description: Commit, branch or tag whose JS becomes the update
        type: string
        required: true
      rollout:
        description: Rollout percentage 0-100
        type: string
        required: false
        default: "10"
      baseline_tag:
        description: Release tag whose build-info.json is the fingerprint baseline (empty uses the latest release)
        type: string
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  # A constant group, not one keyed on github.ref: `github.ref` is
  # refs/heads/main on a push or a dispatch and refs/tags/vX.Y.Z on a
  # `release: published` event, so a ref-keyed group put cd-beta in a
  # queue of its own and let it touch a store while cd-internal or a
  # production dispatch was in one. Every workflow that talks to App Store
  # Connect, Play or the update server shares this one queue.
  group: release
  cancel-in-progress: false
jobs:
  baseline:
    name: Fingerprint baseline
    # Same gate as `publish`: without it a dispatch on a repo with OTA off burns
    # a runner and then fails with "no baseline release found", which reads as a
    # hotfix problem rather than "OTA is not enabled here".
    if: ${{ vars.OTA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      fp-ios: ${{ steps.resolve.outputs.fp-ios }}
    steps:
      - name: Resolve the fingerprint baseline tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_TAG: ${{ inputs.baseline_tag }}
        run: |
          set -euo pipefail
          tag="$BASELINE_TAG"
          if [ -z "$tag" ]; then
            # The store build currently installed on the channel is the latest
            # release; `--exclude-pre-releases` keeps the `-build.N` internal
            # pre-releases out of the answer.
            tag="$(gh release list --limit 1 --exclude-pre-releases \
              --json tagName --jq '.[0].tagName // empty')"
          fi
          if [ -z "$tag" ]; then
            echo "no baseline release found; pass baseline_tag explicitly" >&2
            exit 1
          fi
          echo "baseline: $tag"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          # The baseline release carries the build-info.json of the binary now
          # installed on the channel, and its iOS fingerprint is exactly the
          # runtime version the update will be served under — which is what the
          # publish's manifest smoke check has to ask the server for. Without it
          # a hotfix, the publish most likely to be made under pressure, is the
          # one publish nobody verifies actually served anything.
          fp=''
          if gh release download "$tag" --pattern build-info.json --dir . --clobber 2>/dev/null; then
            fp="$(node -e 'process.stdout.write(String(require("./build-info.json")?.fingerprint?.ios ?? ""))' 2>/dev/null || true)"
          fi
          [ -n "$fp" ] || echo "no fingerprint.ios on $tag; the manifest smoke check will be skipped" >&2
          echo "fp-ios=$fp" >>"$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: baseline
    if: ${{ vars.OTA_ENABLED == 'true' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/publish-ota.yml@v0
    permissions:
      contents: read
    with:
      ota-enabled: ${{ vars.OTA_ENABLED == 'true' }}
      ref: ${{ inputs.ref }}
      channel: ${{ inputs.channel }}
      # A dispatcher who clears the field submits '', and fromJSON('') is an
      # expression error rather than a readable message.
      rollout: ${{ fromJSON(inputs.rollout || '10') }}
      # A production hotfix goes through the same required reviewer as a store
      # release; internal and beta do not gate.
      environment: ${{ inputs.channel == 'production' && 'production' || '' }}
      ota-cli-version: ${{ vars.OTA_CLI_VERSION }}
      baseline-tag: ${{ needs.baseline.outputs.tag }}
      # Recovered from the baseline release above, so a hotfix gets the same
      # "did the server actually serve this?" check as every other publish. An
      # empty runtime version skips the check rather than failing the publish.
      manifest-url: ${{ needs.baseline.outputs.fp-ios != '' && vars.EXPO_UPDATES_URL || '' }}
      runtime-version: ${{ needs.baseline.outputs.fp-ios }}
    secrets:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
