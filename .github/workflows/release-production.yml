name: release-production
# The only manually triggered step in the path, and the only one behind a
# required reviewer. It never builds: it acts on the binary that beta already
# soaked, through the App Store Connect and Play APIs.
#
#   action=release   submit to the App Store / roll out on Play, mark the
#                    GitHub release latest, publish OTA production, deploy web
#   action=rollout   ramp the Play staged rollout to play_rollout_percent
#   action=halt      pause the iOS phased release and halt the Play rollout
#   action=resume    resume the iOS phased release, resume Play at the percent
#   action=complete  finish the iOS phased release and take Play to 100%
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to act on (e.g. v1.2.3)
        type: string
        required: true
      action:
        description: What to do with that release
        type: choice
        required: true
        default: release
        options: [release, rollout, halt, resume, complete]
      play_rollout_percent:
        description: Play staged-rollout percentage (rollout/resume; release uses it as the initial fraction)
        type: string
        required: false
        default: "10"
      ios_phased_release:
        description: Use App Store phased release for action=release
        type: boolean
        required: false
        default: true
      platforms:
        description: Which stores to act on - action=rollout is Android-only, so choosing ios with it does nothing
        type: choice
        required: false
        default: both
        options: [both, ios, android]
permissions:
  contents: read
concurrency:
  # A constant group, not one keyed on github.ref: `github.ref` is
  # refs/heads/main on a push or a dispatch and refs/tags/vX.Y.Z on a
  # `release: published` event, so a ref-keyed group put release-beta in a
  # queue of its own and let it touch a store while release-internal or a
  # production dispatch was in one. Every workflow that talks to App Store
  # Connect, Play or the update server shares this one queue.
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    uses: blinkbitcoin/react-native-workflows/.github/workflows/expo-prepare.yml@v0
    permissions:
      contents: read
      # expo-prepare declares `actions: read` statically (its green-workflow
      # gate runs `gh run list`), and a called workflow can only narrow the
      # caller's token — so it has to be granted here even though this caller
      # sets no `require-green-workflow`.
      actions: read
    with:
      # The tag, not a ref: it fixes the checkout, the stamped commit
      # (`TAG^{commit}`, exposed as the `sha` output) and the store notes, which
      # come from that release's body rather than from commit subjects.
      release-tag: ${{ inputs.tag }}
      stage: production
      build-number-offset: ${{ fromJSON(vars.BUILD_NUMBER_OFFSET || '1000') }}
      build-env: >-
        {"APP_VARIANT":"production",
        "OTA_ENABLED":"${{ vars.OTA_ENABLED }}",
        "EXPO_UPDATES_URL":"${{ vars.EXPO_UPDATES_URL }}",
        "STORE_NOTES_INCLUDE_CHANGELOG":"${{ vars.STORE_NOTES_INCLUDE_CHANGELOG }}",
        "RELEASE_NOTES_LLM_PROVIDER":"${{ vars.RELEASE_NOTES_LLM_PROVIDER }}",
        "RELEASE_NOTES_LLM_MODEL":"${{ vars.RELEASE_NOTES_LLM_MODEL }}",
        "OPENAI_BASE_URL":"${{ vars.OPENAI_BASE_URL }}",
        "EXPO_PUBLIC_API_URL":"${{ vars.EXPO_PUBLIC_API_URL }}",
        "EXPO_PUBLIC_APP_NAME":"${{ vars.EXPO_PUBLIC_APP_NAME }}",
        "EXPO_PUBLIC_WEB_DOMAIN":"${{ vars.EXPO_PUBLIC_WEB_DOMAIN }}",
        "EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE":"${{ vars.EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE || 'false' }}"}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ---- action=release -------------------------------------------------------

  ios-release:
    needs: prepare
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' && (inputs.action == 'release' && inputs.platforms != 'android') }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: ios
      lane: release_production
      runner: ubuntu-latest
      # Required reviewers, "prevent self-review" and the `v*` tag pattern live
      # on this environment; it is what makes production a two-person action.
      environment: production
      artifacts: release-meta
      env-json: '{"IOS_PHASED_RELEASE": "${{ inputs.ios_phased_release }}"}'
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
      timeout-minutes: 90
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # App Review contact and demo account for the App Store submission.
      # Secrets, not env-json/build-env: a reviewer demo login is a real
      # credential and both of those inputs are printed to the log.
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}

  android-release:
    needs: prepare
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' && (inputs.action == 'release' && inputs.platforms != 'ios') }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: android
      lane: release_production
      runner: ubuntu-latest
      environment: production
      artifacts: release-meta
      env-json: '{"PLAY_ROLLOUT": "${{ inputs.play_rollout_percent }}", "PLAY_UPDATE_PRIORITY": "${{ vars.PLAY_UPDATE_PRIORITY }}"}'
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ---- action=halt | resume | complete (iOS phased release) -----------------

  ios-phased:
    needs: prepare
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' && (contains(fromJSON('["halt", "resume", "complete"]'), inputs.action) && inputs.platforms != 'android') }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: ios
      lane: phased
      # The lane takes pause|resume|complete; `halt` is this workflow's
      # cross-platform word for the same thing.
      lane-args: action:${{ inputs.action == 'halt' && 'pause' || inputs.action }}
      runner: ubuntu-latest
      environment: production
      artifacts: release-meta
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

  # ---- action=rollout | resume | complete (Play staged rollout) -------------

  android-rollout:
    needs: prepare
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' && (contains(fromJSON('["rollout", "resume", "complete"]'), inputs.action) && inputs.platforms != 'ios') }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: android
      lane: rollout
      lane-args: percent:${{ inputs.action == 'complete' && '100' || inputs.play_rollout_percent }}
      runner: ubuntu-latest
      environment: production
      artifacts: release-meta
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ---- action=halt (Play) ---------------------------------------------------

  android-halt:
    needs: prepare
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' && (inputs.action == 'halt' && inputs.platforms != 'ios') }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: android
      lane: halt
      runner: ubuntu-latest
      environment: production
      artifacts: release-meta
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  # ---- action=release only: mark latest, publish OTA, deploy web ------------

  github-release:
    # `prepare` is ordering, not data: this job keys off `inputs.tag`, but the
    # `release-meta` artifact it attaches only exists once prepare has run.
    needs: [prepare, ios-release, android-release]
    # A status function in the `if` drops the implicit success() requirement, so
    # a job skipped by `platforms` does not skip this one; `!failure()` still
    # holds the line on a store job that actually failed.
    if: ${{ !failure() && !cancelled() && inputs.action == 'release' }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/github-release.yml@v0
    permissions:
      contents: write
    with:
      mode: latest
      tag: ${{ inputs.tag }}
      assets-artifacts: release-meta
      # Empty when uploads ran, so a real store build carries no marker.
      # Inverted on purpose: GitHub's `&&` yields its first falsy operand, so
      # `cond && '' || X` is X on both branches - the non-empty value has to sit
      # in the `&&` slot.
      body-note: >-
        ${{ vars.STORE_UPLOADS_ENABLED != 'true' && 'Store uploads were off for this build: it was never sent to TestFlight or Play. Set the repository variable STORE_UPLOADS_ENABLED to true to turn them on.' || '' }}
    secrets:
      RELEASE_TAGGER_APP_ID: ${{ secrets.RELEASE_TAGGER_APP_ID }}
      RELEASE_TAGGER_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TAGGER_APP_PRIVATE_KEY }}

  # A production dispatch otherwise leaves no record on the release of which
  # stage it reached — which release went out, when, to which stores, at what
  # rollout. The section is marker-delimited and rewritten in place, so the
  # release body always shows the *last* production action.
  #
  # `production-stage.md` is deliberately not one of github-release's fixed
  # asset globs: `append` regenerates SHA256SUMS over whatever of that set is in
  # the download directory, and an artifact carrying one of those names would
  # replace the checksums of the release's binaries.
  stage-note:
    needs: [prepare, ios-release, android-release, ios-phased, android-rollout, android-halt]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the stage line
        env:
          ACTION: ${{ inputs.action }}
          PLATFORMS: ${{ inputs.platforms }}
          ROLLOUT: ${{ inputs.play_rollout_percent }}
        run: |
          set -euo pipefail
          mkdir -p section
          printf '%s at %s, platforms %s, rollout %s%%\n' \
            "$ACTION" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$PLATFORMS" "$ROLLOUT" \
            > section/production-stage.md
          cat section/production-stage.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-stage
          path: section/production-stage.md
          if-no-files-found: error

  stage-append:
    needs: [prepare, stage-note]
    if: ${{ !failure() && !cancelled() }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/github-release.yml@v0
    permissions:
      contents: write
    with:
      mode: append
      tag: ${{ inputs.tag }}
      append-title: Production
      notes-artifact: release-stage
      notes-file: production-stage.md
    secrets:
      RELEASE_TAGGER_APP_ID: ${{ secrets.RELEASE_TAGGER_APP_ID }}
      RELEASE_TAGGER_APP_PRIVATE_KEY: ${{ secrets.RELEASE_TAGGER_APP_PRIVATE_KEY }}

  ota-production:
    # github-release is what puts build-info.json on the tag, which is the
    # fingerprint baseline the gate downloads.
    needs: [prepare, github-release]
    if: ${{ !failure() && !cancelled() && inputs.action == 'release' && vars.OTA_ENABLED == 'true' }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/expo-ota-publish.yml@v0
    permissions:
      contents: read
    with:
      ota-enabled: ${{ vars.OTA_ENABLED == 'true' }}
      ref: ${{ inputs.tag }}
      channel: production
      rollout: 100
      environment: production
      ota-cli-version: ${{ vars.OTA_CLI_VERSION }}
      baseline-tag: ${{ inputs.tag }}
      # smoke.sh defaults to the ios platform, so the iOS fingerprint is the
      # runtime version to ask the server for.
      manifest-url: ${{ vars.EXPO_UPDATES_URL }}
      runtime-version: ${{ needs.prepare.outputs.fp-ios }}
    secrets:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}

  # init:web-start
  web:
    # Pure ordering: the site should not go live before the stores have accepted
    # the release. Neither job's outputs are read here.
    needs: [prepare, github-release]
    # The site tracks what is actually live in the stores, so it deploys from
    # the production dispatch rather than from the tag push.
    if: ${{ !failure() && !cancelled() && inputs.action == 'release' }}
    uses: blinkbitcoin/react-native-workflows/.github/workflows/web.yml@v0
    permissions:
      contents: read
      # The called `deploy` job (environment `github-pages`) needs these, and a
      # called job can only narrow the caller's token, never widen it.
      pages: write
      id-token: write
    with:
      ref: ${{ inputs.tag }}
      deploy: true
      # Deliberately on: the reviewer has already approved, and a broken site is
      # the one failure mode nothing downstream would catch. It adds a browser
      # e2e run (~15-20 min) to the dispatch on code CI already tested at merge.
      playwright: true
  # init:web-end
