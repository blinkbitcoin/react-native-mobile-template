name: CI
on:
  push:
    branches: [main]
    # No paths-ignore: it would be a second, narrower docs rule that already
    # disagrees with the classifier's (it misses LICENSE and the issue/PR
    # templates). check-code.yml's `changes` job is the single source - it
    # classifies pushes too, so a docs-only merge still skips unit and e2e.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # On a branch, one group per ref and the newest push cancels the rest. On
  # main, one group per *commit*: GitHub keeps a single pending run per group
  # and evicts the older one, so two quick merges behind a running main CI
  # lost the middle commit's run entirely (5c6a1a1, 1eb3037) - and with no
  # green CI, that commit's internal release refused to build. A main push
  # must never be cancelled by the next one; the non-empty value sits in the
  # `&&` slot on purpose (GitHub's `&&` yields its first falsy operand).
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  checks:
    name: Checks
    uses: blinkbitcoin/shared-workflows/.github/workflows/check-code.yml@aa12aaa99407e2800ffccb4db21ff962dc681b05 # v0.13.0
    with:
      # Runs `pnpm check:release` (= `make check-release`): Ruby syntax, a
      # fastlane lane parse and the lane unit tests. Needs Ruby, which is why
      # the toggle is off by default in the reusable workflow.
      release-checks: true
      # Both off by default upstream, because a consumer without the scripts
      # would fail; this one has them. Until these were switched on, `make
      # check-gen` ran on developer machines and in no CI job - a green local
      # gate implying a check CI never made.
      i18n: true
      graphql-codegen: true
  unit:
    name: Unit
    needs: checks
    if: ${{ needs.checks.outputs.docs-only != 'true' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/check-unit.yml@aa12aaa99407e2800ffccb4db21ff962dc681b05 # v0.13.0
  e2e:
    name: E2E
    # `unit` as well as `checks`, so a failed unit run never reaches E2E. On a
    # green run that costs the minute or two unit takes; on a red one it saves a
    # full E2E - fifteen to twenty-five minutes of Android, and macOS at ten
    # times the rate when iOS is on - to learn what unit already knew.
    needs: [checks, unit]
    if: ${{ needs.checks.outputs.docs-only != 'true' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/check-e2e.yml@aa12aaa99407e2800ffccb4db21ff962dc681b05 # v0.13.0
    with:
      # iOS runs on a push to main (and a manual run) when the repo variable
      # E2E_IOS is true, and on a PR only when it carries the `e2e:ios` label
      # (the `labeled` trigger above is what makes the label alone start a
      # run). So every merge is covered while a PR waits only for Android,
      # which takes about a third as long. This repo is public, so macOS runners
      # are free and E2E_IOS is true here. An app generated from this template
      # is usually private, where macOS bills at 10x, which is why the workflow
      # default is still off. scripts/ci-e2e-ios.test.mjs evaluates this line.
      ios: ${{ (github.event_name != 'pull_request' && vars.E2E_IOS == 'true') || contains(github.event.pull_request.labels.*.name, 'e2e:ios') }}
      macos-runner: ${{ vars.WORKFLOWS_MACOS_RUNNER || 'macos-26' }}
      # Android only. The iOS suite runs a Release build below, which embeds the
      # bundle and has no dev launcher, so check-e2e.yml forces dev-client off there.
      dev-client: true
      # Release, because the Debug/dev-client path never ran twice in a row on a
      # runner. It needed Metro up, a deep link delivered, an iOS "Open in
      # <app>?" prompt answered, and a 2000-module bundle fetched over localhost
      # before the dev client gave up - four things that each have to succeed
      # every time, and three of which were seen to fail. A Release build needs
      # none of them: `simctl launch` and the app is running.
      #
      # The cost, accepted: the iOS suite no longer exercises the Metro dev
      # path. That is a development concern, and not something these flows
      # assert - they check the app's screens, which a Release build shows the
      # same way. Android still covers the dev-client path.
      ios-configuration: Release
      # The other half of that trade. A Release build resolves `.env.production`
      # at bundle time, which points at a placeholder host, so the `home` flow -
      # it asserts data fetched over GraphQL - had nothing to talk to. An
      # exported variable wins over the dotenv file, so this is the URL the
      # bundle embeds. It has to be a literal: the build job runs before, and on
      # a different runner from, the job that starts the mock API. 8082 is
      # `BASE_DEFAULT` 8080 plus `mockApi.offset` 2 from `scripts/ports.mjs`,
      # deterministic on a runner because nothing sets `APP_PORT_BASE` there.
      build-env: '{"EXPO_PUBLIC_API_URL":"http://localhost:8082/graphql"}'
      e2e-setup-script: scripts/e2e/ci-mock-api-up.sh
      e2e-teardown-script: scripts/e2e/ci-mock-api-down.sh
  security:
    name: Security
    needs: checks
    # SECURITY_ENABLED is the per-repository master switch, opt-out because a
    # generated app gets the deterministic scanners on. A skipped job is green,
    # so turning it off never holds up require-green-workflow: ci.yml. Which
    # scanners actually run is security-policy.json's decision; the inputs below
    # only say what this tier allows.
    if: ${{ needs.checks.outputs.docs-only != 'true' && vars.SECURITY_ENABLED != 'false' }}
    # The verdict job uploads SARIF to code scanning. A called workflow can only
    # narrow the caller's token, so a grant smaller than this is not a failed
    # step but a startup_failure of the whole run.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: blinkbitcoin/shared-workflows/.github/workflows/check-security.yml@aa12aaa99407e2800ffccb4db21ff962dc681b05 # v0.13.0
    with:
      # The diff review runs on pull requests, and on the release pull request,
      # whose CI is the workflow_dispatch cd-release.yml starts on its branch -
      # so it is recognised by github.ref_name. github.head_ref is empty there.
      review: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'release-please--') }}
      # The release pull request is the last stop before a tag: it adds the
      # minutes-long bundle scan and OpenAnt, and reviews everything since the
      # last release rather than one pull request's diff.
      bundle: ${{ startsWith(github.ref_name, 'release-please--') }}
      openant: ${{ startsWith(github.ref_name, 'release-please--') }}
      review-full-range: ${{ startsWith(github.ref_name, 'release-please--') }}
      # Non-secret only. The provider and model are repository variables; the
      # keys travel as secrets below and reach only the two LLM scan steps.
      build-env: >-
        {"SECURITY_LLM_PROVIDER":"${{ vars.SECURITY_LLM_PROVIDER }}",
        "SECURITY_LLM_MODEL":"${{ vars.SECURITY_LLM_MODEL }}",
        "SECURITY_LLM_EFFORT":"${{ vars.SECURITY_LLM_EFFORT }}",
        "SECURITY_LLM_EXTRA_PARAMS":${{ toJSON(vars.SECURITY_LLM_EXTRA_PARAMS || '') }},
        "OPENAI_BASE_URL":"${{ vars.OPENAI_BASE_URL }}"}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  badges:
    name: Badges
    needs: [checks, unit, e2e]
    # always(), so a red Unit still gets a red badge. A cancelled upstream job
    # says nothing about the branch, and a docs-only change never ran the jobs
    # the badges describe - in both cases the published badges stay as they are.
    # publish-badges.yml itself also skips release events and fork PRs (no push token).
    if: >-
      always() &&
      needs.checks.result != 'cancelled' &&
      needs.unit.result != 'cancelled' &&
      needs.e2e.result != 'cancelled' &&
      needs.checks.outputs.docs-only != 'true'
    permissions:
      contents: write # publish-badges.sh pushes the gh-pages branch
    uses: blinkbitcoin/shared-workflows/.github/workflows/publish-badges.yml@aa12aaa99407e2800ffccb4db21ff962dc681b05 # v0.13.0
    with:
      unit-result: ${{ needs.unit.result }}
      e2e-result: ${{ needs.e2e.result }}
      docs-only: ${{ needs.checks.outputs.docs-only }}
