name: release-retry
# `release-beta.yml` refuses to promote until that commit's `release-internal`
# run is green. When beta is published before internal finishes (or while it is
# red), the beta run fails at the gate and there is nothing to re-trigger it —
# `release: published` fires once. This workflow closes that hole: whenever an
# internal run for main concludes successfully, it re-runs the failed jobs of a
# beta run for the same commit.
on:
  workflow_run:
    workflows: [release-internal]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  # Per-sha, and not the shared `release-` group: this is precisely the
  # workflow that must run promptly after an internal run goes green, and the
  # shared group would park it behind the next 60-90 minute build (or evict it
  # outright). It calls no store API.
  group: release-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  retry-beta:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # `gh run rerun` writes to the Actions API.
      actions: write
    steps:
      - name: Re-run a beta run blocked on the green gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # `--commit` is the internal run's head sha, which is the release
          # commit. A `release: published` beta run's head sha is the default
          # branch tip at publish time, so if a commit lands on main between the
          # release commit and this run going green, no beta run matches and the
          # retry no-ops. That is accepted: the operator can re-run release-beta
          # by hand, and matching more loosely risks re-running a beta promotion
          # for a different release.
          #
          # Not `--status failure`: a beta run that was cancelled or timed out
          # (including one evicted from a concurrency group) needs the same
          # retry, so filter on "concluded, but not successfully" instead.
          run_id="$(gh run list --workflow release-beta.yml --commit "$HEAD_SHA" \
            --limit 20 --json databaseId,status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")][0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "no failed release-beta run for $HEAD_SHA - nothing to retry"
            exit 0
          fi
          # --failed re-runs only the jobs that failed, so the promotion picks
          # up where the gate stopped it instead of promoting twice.
          gh run rerun "$run_id" --failed
