name: CD / Release
# Keeps one "chore(main): release X.Y.Z" PR open against main. Merging that PR
# is the only human action that cuts a release: it bumps package.json, writes
# the CHANGELOG section, tags `vX.Y.Z` and publishes the GitHub release, which
# is what `release-beta.yml` listens for.
#
# Merge that PR with **squash** (or rebase). `scripts/release/resolve-version.sh`
# reads the release commit's `chore(main): release X.Y.Z` subject to stamp the
# build that ships with the release — release-internal runs on the same push and
# the tag does not exist yet, so the subject is the only source that is right on
# that commit. Squash and rebase both put the PR title on main; a merge commit
# writes `Merge pull request #N from …` and the script has to fall back to the
# merge's second parent to find it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Deliberately NOT the shared `release-` group. GitHub keeps one pending run
  # per group and evicts the older one, so sharing it with release-internal
  # would leave the release PR stale for the length of a build and drop this
  # run entirely on two quick pushes. Nothing here touches a store, so it does
  # not need the store-serialising group.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # The dispatch steps below write to the Actions API.
      actions: write
    # Consumed by the dispatch steps below, and exposed for a consumer that
    # wants to chain something else off the cut release (e.g. moving a major
    # tag).
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Manifest mode only. `release-type`, `package-name`,
      # `include-component-in-tag`, `bump-minor-pre-major` and
      # `changelog-sections` all live in release-please-config.json under
      # packages["."] — passing any of them inline here makes the action ignore
      # both the config file and the manifest.
      - name: Release please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Everything release-please creates - the PR, the tag, the release - is
      # created with GITHUB_TOKEN, and GitHub never starts a workflow from an
      # event that token caused, so nothing downstream would run from a
      # `release: published` or `pull_request` trigger. The one exemption is
      # `workflow_dispatch`, so the follow-on work is started here by name.
      # `--ref "$TAG"` puts the run on the release commit: `github.sha` is then
      # the same sha release-internal built, which is what release-retry.yml
      # matches on.
      - name: Start the beta promotion at the new tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release-beta.yml --repo "$REPO" --ref "$TAG" -f "tag=$TAG"
      - name: Deploy the web build at the new tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run web.yml --repo "$REPO" --ref "$TAG" -f "deploy=true"
      # The release PR is bot-authored, so its own `pull_request` runs wait for
      # a human to approve them and are marked failed when the PR merges. This
      # is the run that counts. It is a full CI run, E2E included, once per
      # update of the release PR - free on a public repository; a private
      # consumer that finds it too much can drop this one step.
      # The PR's branch is read from the `pr` output in the shell, not with
      # `fromJSON()` in `env:`: the runner validates a step's `env` expressions
      # even when its `if` is false, and `fromJSON('')` is a template error -
      # which failed this job on the first push that produced no release PR.
      - name: Run CI on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r '.headBranchName // empty' <<<"$PR_JSON")"
          if [ -z "$branch" ]; then
            echo "release-please reported a PR but its 'pr' output has no headBranchName" >&2
            exit 1
          fi
          gh workflow run ci.yml --repo "$REPO" --ref "$branch"
