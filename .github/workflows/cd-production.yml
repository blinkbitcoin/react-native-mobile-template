name: CD / Production
# The only manually triggered step in the path, and the only one behind a
# required reviewer. It never builds: it acts on the binary that beta already
# soaked, through the App Store Connect and Play APIs.
#
#   action=release   submit to the App Store / roll out on Play, mark the
#                    GitHub release latest, publish OTA production, deploy web
#   action=rollout   ramp the Play staged rollout to play_rollout_percent
#   action=halt      pause the iOS phased release and halt the Play rollout
#   action=resume    resume the iOS phased release, resume Play at the percent
#   action=complete  finish the iOS phased release and take Play to 100%
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to act on (e.g. v1.2.3)
        type: string
        required: true
      action:
        description: What to do with that release
        type: choice
        required: true
        default: release
        options: [release, rollout, halt, resume, complete]
      play_rollout_percent:
        description: Play staged-rollout percentage (rollout/resume; release uses it as the initial fraction)
        type: string
        required: false
        default: "10"
      ios_phased_release:
        description: Use App Store phased release for action=release
        type: boolean
        required: false
        default: true
      platforms:
        description: Which stores to act on - action=rollout is Android-only, so choosing ios with it does nothing
        type: choice
        required: false
        default: both
        options: [both, ios, android]
permissions:
  contents: read
concurrency:
  # A constant group, not one keyed on github.ref: `github.ref` is
  # refs/heads/main on a push or a dispatch and refs/tags/vX.Y.Z on a
  # `release: published` event, so a ref-keyed group put cd-beta in a
  # queue of its own and let it touch a store while cd-internal or a
  # production dispatch was in one. Every workflow that talks to App Store
  # Connect, Play or the update server shares this one queue.
  group: release
  cancel-in-progress: false
jobs:
  # The whole release or rollout change - prepare from the tag, the binary-side
  # security gate, the App Store and Play releases (and Huawei), the staged
  # rollout lanes, the release marked latest, the stage note, the OTA publish
  # and the web redeploy - is shared-workflows' publish-production.yml. This
  # file keeps the dispatch trigger and the concurrency group above, the
  # permissions, and the secrets. The required reviewer sits on the
  # `production` environment the store jobs run in.
  production:
    name: Production
    uses: blinkbitcoin/shared-workflows/.github/workflows/publish-production.yml@626e2c6565242bc64f9e220c8464fd931715e022 # v0.29.0
    permissions:
      contents: write
      actions: read
      # The security gate uploads its verdict to code scanning.
      security-events: write
      # init:web-start
      # The web redeploy's `deploy` job needs these, and a called job can only
      # narrow the caller's token, never widen it.
      pages: write
      id-token: write
      # init:web-end
    with:
      tag: ${{ inputs.tag }}
      action: ${{ inputs.action }}
      platforms: ${{ inputs.platforms }}
      play-rollout-percent: ${{ inputs.play_rollout_percent }}
      ios-phased-release: ${{ inputs.ios_phased_release }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
      # `build-number-offset` is a `number` input, and an unset repo variable is
      # the empty string, which fails input validation rather than falling back
      # to the pipeline's default. fromJSON turns the fallback into a real number.
      build-number-offset: ${{ fromJSON(vars.BUILD_NUMBER_OFFSET || '1000') }}
      store-uploads-enabled: ${{ vars.STORE_UPLOADS_ENABLED == 'true' }}
      play-update-priority: ${{ vars.PLAY_UPDATE_PRIORITY }}
      security-enabled: ${{ vars.SECURITY_ENABLED != 'false' }}
      # init:web-start
      web: true
      # The same base path ci-web.yml's deploy bakes in. A project Pages site is
      # served under `/<repo>/` and a custom domain at `/`; without this the
      # release redeployed the site with every asset path missing `/<repo>`.
      web-base-url: ${{ vars.EXPO_PUBLIC_WEB_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
      # init:web-end
      # `environment-variables` is the only way a caller gets an environment variable into
      # the prebuild, the lanes and the consumer scripts. Non-secret only: the
      # value is a workflow input, unmasked and visible to anyone who can read
      # the run, and build-env.sh refuses a key that looks like a credential.
      environment-variables: >-
        {"APP_VARIANT":"production",
        "OTA_ENABLED":"${{ vars.OTA_ENABLED }}",
        "EXPO_UPDATES_URL":"${{ vars.EXPO_UPDATES_URL }}",
        "EXPO_PUBLIC_API_URL":"${{ vars.EXPO_PUBLIC_API_URL }}",
        "EXPO_PUBLIC_APP_NAME":"${{ vars.EXPO_PUBLIC_APP_NAME }}",
        "EXPO_PUBLIC_WEB_DOMAIN":"${{ vars.EXPO_PUBLIC_WEB_DOMAIN }}",
        "EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE":"${{ vars.EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE || 'false' }}"}
      ota-enabled: ${{ vars.OTA_ENABLED == 'true' }}
      ota-cli-version: ${{ vars.OTA_CLI_VERSION }}
      manifest-url: ${{ vars.EXPO_UPDATES_URL }}
      huawei-uploads-enabled: ${{ vars.HUAWEI_UPLOADS_ENABLED == 'true' }}
      huawei-environment-variables: '{"APP_VARIANT":"production", "HUAWEI_APP_ID": "${{ vars.HUAWEI_APP_ID }}", "HUAWEI_UPLOADS_ENABLED": "${{ vars.HUAWEI_UPLOADS_ENABLED }}", "HUAWEI_SUBMIT_DELAY_SECONDS": "${{ vars.HUAWEI_SUBMIT_DELAY_SECONDS }}"}'
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
      HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
