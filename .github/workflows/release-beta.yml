name: CD / Beta
# Dispatched by release-please.yml the moment it cuts the `vX.Y.Z` release
# (not `release: published`: a release created with GITHUB_TOKEN never fires
# that). It never builds: it waits for that exact commit's `release-internal`
# run to be green and then promotes the binary that run already uploaded, so
# beta ships bytes that were tested on internal.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote (e.g. v1.2.3)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  # A constant group, not one keyed on github.ref: `github.ref` is
  # refs/heads/main on a push or a dispatch and refs/tags/vX.Y.Z on a
  # `release: published` event, so a ref-keyed group put release-beta in a
  # queue of its own and let it touch a store while release-internal or a
  # production dispatch was in one. Every workflow that talks to App Store
  # Connect, Play or the update server shares this one queue.
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare
    uses: blinkbitcoin/shared-workflows/.github/workflows/expo-prepare.yml@v0
    permissions:
      contents: read
      # `require-green-workflow` runs `gh run list` against the gated workflow;
      # without this the gate cannot see release-internal's runs.
      actions: read
    with:
      # `release-tag` (not `ref`) is what makes this correct: it becomes the
      # checkout ref, the gated and stamped commit (`TAG^{commit}`, exposed as
      # the `sha` output) and the source of the store notes. A manual dispatch
      # can run on main while promoting an older tag - gating on `github.sha`
      # would check the wrong commit's CI.
      release-tag: ${{ inputs.tag }}
      stage: beta
      build-number-offset: ${{ fromJSON(vars.BUILD_NUMBER_OFFSET || '1000') }}
      # A promotion must never ship a binary whose own build never went green.
      require-green-workflow: release-internal.yml
      build-env: >-
        {"APP_VARIANT":"production",
        "OTA_ENABLED":"${{ vars.OTA_ENABLED }}",
        "EXPO_UPDATES_URL":"${{ vars.EXPO_UPDATES_URL }}",
        "STORE_NOTES_INCLUDE_CHANGELOG":"${{ vars.STORE_NOTES_INCLUDE_CHANGELOG }}",
        "RELEASE_NOTES_LLM_PROVIDER":"${{ vars.RELEASE_NOTES_LLM_PROVIDER }}",
        "RELEASE_NOTES_LLM_MODEL":"${{ vars.RELEASE_NOTES_LLM_MODEL }}",
        "OPENAI_BASE_URL":"${{ vars.OPENAI_BASE_URL }}",
        "EXPO_PUBLIC_API_URL":"${{ vars.EXPO_PUBLIC_API_URL }}",
        "EXPO_PUBLIC_APP_NAME":"${{ vars.EXPO_PUBLIC_APP_NAME }}",
        "EXPO_PUBLIC_WEB_DOMAIN":"${{ vars.EXPO_PUBLIC_WEB_DOMAIN }}",
        "EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE":"${{ vars.EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE || 'false' }}"}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  promote-ios:
    name: Promote iOS
    # Off unless the repository says otherwise, so a checkout with no store
    # credentials still runs everything that does not need one.
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' }}
    needs: prepare
    uses: blinkbitcoin/shared-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: ios
      lane: promote_beta
      # Promotion is an App Store Connect API call; no Xcode, no macOS minutes.
      runner: ubuntu-latest
      environment: beta
      artifacts: release-meta
      env-json: '{"TESTFLIGHT_EXTERNAL_GROUP": "${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}"}'
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # The Beta App Review contact and demo account. Secrets rather than
      # env-json/build-env because a reviewer demo login is a real credential
      # and both of those inputs are printed to the log. `promote_beta` omits
      # the whole argument when none of them is set — pilot PATCHes every key it
      # is given, so blanks would erase the contact in App Store Connect.
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}

  promote-android:
    name: Promote Android
    # Off unless the repository says otherwise, so a checkout with no store
    # credentials still runs everything that does not need one.
    if: ${{ vars.STORE_UPLOADS_ENABLED == 'true' }}
    needs: prepare
    uses: blinkbitcoin/shared-workflows/.github/workflows/fastlane-lane.yml@v0
    permissions:
      contents: read
    with:
      platform: android
      lane: promote_beta
      runner: ubuntu-latest
      environment: beta
      artifacts: release-meta
      build-env: '{"APP_VARIANT":"production"}'
      version: ${{ needs.prepare.outputs.version }}
      build-number: ${{ needs.prepare.outputs.build-number }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}

  github-release:
    name: GitHub Release
    # `!cancelled() && !failure()` is what lets this run when the promotions are
    # skipped: a skipped dependency skips its dependents unless the condition
    # uses a status function.
    needs: [prepare, promote-ios, promote-android]
    if: ${{ !cancelled() && !failure() }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/github-release.yml@v0
    permissions:
      contents: write
    with:
      mode: promote
      tag: ${{ inputs.tag }}
      # The promoted release must ship the bytes internal testers actually ran.
      # `from-tag` re-uploads the pre-release's ipa/aab/apk/dSYM/mapping to this
      # tag and regenerates SHA256SUMS over the merged set; a rebuild from the
      # same source would be a different binary with a different signature and a
      # different fingerprint, and the OTA gate downstream compares fingerprints.
      # The build number is derived from the tag's commit, so it resolves to the
      # same `-build.N` tag release-internal created for that sha.
      from-tag: v${{ needs.prepare.outputs.version }}-build.${{ needs.prepare.outputs.build-number }}
      # Empty when uploads ran, so a real store build carries no marker.
      # Inverted on purpose: GitHub's `&&` yields its first falsy operand, so
      # `cond && '' || X` is X on both branches - the non-empty value has to sit
      # in the `&&` slot.
      body-note: >-
        ${{ vars.STORE_UPLOADS_ENABLED != 'true' && 'Store uploads were off for this build: it was never sent to TestFlight or Play. Set the repository variable STORE_UPLOADS_ENABLED to true to turn them on.' || '' }}
      # Removed only after the upload succeeded; a re-run whose source is
      # already gone continues instead of failing.
      delete-source: true
      # build-info.json and the store notes from this run ride along, so the
      # release is the single record of what beta got — and so the OTA gate
      # below has a fingerprint baseline to download.
      assets-artifacts: release-meta

  # The store notes are what beta testers and, later, App Review actually read,
  # and until now nothing showed the operator what the pipeline would ship. The
  # runbook's override flow ("edit the `## Store notes` section of the release
  # body") also expected a section that was never written.
  #
  # The section is re-uploaded under a name that is deliberately *not* one of
  # github-release's fixed asset globs: `append` uploads whatever of that set is
  # in the download directory and regenerates SHA256SUMS over it, so handing it
  # `release-meta` here would replace the checksums of the promoted binaries
  # with the checksums of four metadata files.
  store-notes-section:
    name: Store Notes
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-meta
          path: meta
      - name: Rename the notes so it is not one of the release's fixed assets
        run: |
          set -euo pipefail
          mkdir -p section
          cp meta/notes-store.txt section/store-notes-section.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-store-notes
          path: section/store-notes-section.md
          if-no-files-found: error

  store-notes:
    name: Append Notes
    needs: [prepare, store-notes-section]
    uses: blinkbitcoin/shared-workflows/.github/workflows/github-release.yml@v0
    permissions:
      contents: write
    with:
      # Marker-delimited and idempotent across re-runs, so a retry is safe.
      mode: append
      tag: ${{ inputs.tag }}
      append-title: Store notes
      notes-artifact: release-store-notes
      notes-file: store-notes-section.md

  ota-beta:
    name: OTA
    needs: [prepare, github-release]
    if: ${{ vars.OTA_ENABLED == 'true' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/expo-ota-publish.yml@v0
    permissions:
      contents: read
    with:
      ota-enabled: ${{ vars.OTA_ENABLED == 'true' }}
      # The commit the tag actually points at, resolved by prepare — not the
      # ref the dispatch carried.
      ref: ${{ needs.prepare.outputs.sha }}
      channel: beta
      rollout: 100
      environment: beta
      ota-cli-version: ${{ vars.OTA_CLI_VERSION }}
      # The release being promoted is the binary now on the beta track.
      baseline-tag: ${{ inputs.tag }}
      manifest-url: ${{ vars.EXPO_UPDATES_URL }}
      runtime-version: ${{ needs.prepare.outputs.fp-ios }}
    secrets:
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
