name: CD / Release
# Keeps one "chore(main): release X.Y.Z" PR open against main. Merging that PR
# is the only human action that cuts a release: it bumps package.json, writes
# the CHANGELOG section, tags `vX.Y.Z` and publishes the GitHub release.
#
# Merge that PR with **squash** (or rebase). `resolve-version.sh` (the shared
# script; `make version` runs it from @blinkbitcoin/app-tooling) reads the
# release commit's `chore(main): release X.Y.Z` subject to stamp the build
# that ships with the release — cd-internal runs on the same push and
# the tag does not exist yet, so the subject is the only source that is right on
# that commit. Squash and rebase both put the PR title on main; a merge commit
# writes `Merge pull request #N from …` and the script has to fall back to the
# merge's second parent to find it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Deliberately NOT the shared `release-` group. GitHub keeps one pending run
  # per group and evicts the older one, so sharing it with cd-internal
  # would leave the release PR stale for the length of a build and drop this
  # run entirely on two quick pushes. Nothing here touches a store, so it does
  # not need the store-serialising group.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # release-please in manifest mode: `release-type`, `package-name`,
  # `include-component-in-tag`, `bump-minor-pre-major` and
  # `changelog-sections` all live in release-please-config.json under
  # packages["."].
  #
  # Everything release-please creates - the PR, the tag, the release - is
  # created with GITHUB_TOKEN, and GitHub never starts a workflow from an event
  # that token caused, so the shared workflow starts the follow-on work by name
  # (`workflow_dispatch` is the one exemption):
  # - a cut release starts each `dispatch-on-release` line at the new tag, so
  #   that run's `github.sha` is the release commit cd-internal built, which is
  #   what cd-beta-retry.yml matches on;
  # - a created or updated release PR gets a run of `ci-workflow` on its
  #   branch. The PR is bot-authored, so its own `pull_request` runs wait for a
  #   human to approve them; this is the run that counts, a full CI run, E2E
  #   included, on every push to main (the store-notes job below makes
  #   release-please rewrite the PR each time). Free on a public repository; a
  #   private consumer that finds it too much sets `ci-workflow: ''`.
  release-please:
    name: Release
    uses: blinkbitcoin/shared-workflows/.github/workflows/pr-release.yml@c731cdcb138fad6769aee5c4e79596ce699c039b # v0.28.0
    permissions:
      contents: write
      pull-requests: write
      # The dispatches write to the Actions API.
      actions: write
    with:
      ci-workflow: ci.yml
      # One workflow per line, `{tag}` replaced by the tag. `#` lines are
      # skipped, so the init markers stay comments here too.
      dispatch-on-release: |
        cd-beta.yml tag={tag}
        # init:web-start
        ci-web.yml deploy=true
        # init:web-end

  # The store notes, drafted once into the release PR body for a human
  # to review with the version bump. release-please carries the section into
  # the GitHub release body on merge, and beta and production read it back
  # verbatim (build-prepare with release-tag), so this is the only job in the
  # repository that may call an LLM - internal builds keep the free
  # deterministic notes from commits. Its own job, after the dispatches above:
  # a red draft never withholds a release, and `gh run rerun --failed` re-drafts.
  # A hand edit to the section in the PR lasts until the next push to main;
  # edit store-notes.prompt.md instead, or the release body after merging.
  store-notes:
    name: Store notes
    needs: release-please
    if: ${{ needs.release-please.outputs.pr-number != '' }}
    uses: blinkbitcoin/shared-workflows/.github/workflows/pr-store-notes.yml@c731cdcb138fad6769aee5c4e79596ce699c039b # v0.28.0
    permissions:
      contents: read
      pull-requests: write
    with:
      pr-number: ${{ needs.release-please.outputs.pr-number }}
      # The release branch, so the prompt template and the generator under
      # release are the ones that draft.
      ref: ${{ needs.release-please.outputs.pr-branch }}
      # Non-secret only (see the environment-variables note in cd-internal.yml); the
      # two keys travel as secrets below and are only needed when the provider
      # variable selects them.
      environment-variables: >-
        {"STORE_NOTES_INCLUDE_CHANGELOG":"${{ vars.STORE_NOTES_INCLUDE_CHANGELOG }}",
        "STORE_NOTES_LLM_PROVIDER":"${{ vars.STORE_NOTES_LLM_PROVIDER }}",
        "STORE_NOTES_LLM_MODEL":"${{ vars.STORE_NOTES_LLM_MODEL }}",
        "STORE_NOTES_LLM_EFFORT":"${{ vars.STORE_NOTES_LLM_EFFORT }}",
        "STORE_NOTES_LLM_EXTRA_PARAMS":${{ toJSON(vars.STORE_NOTES_LLM_EXTRA_PARAMS || '') }},
        "OPENAI_BASE_URL":"${{ vars.OPENAI_BASE_URL }}"}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
