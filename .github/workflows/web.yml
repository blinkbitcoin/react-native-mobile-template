name: CI / Web
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Dispatched by release-please.yml at the `vX.Y.Z` tag. Not `release:
  # published`: a release created with GITHUB_TOKEN never fires it, and an
  # App-created one would also fire it for every `-build.N` pre-release.
  workflow_dispatch:
    inputs:
      deploy:
        description: Export the production bundle and deploy it to Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  web:
    name: Export
    uses: blinkbitcoin/shared-workflows/.github/workflows/web.yml@v0
    permissions:
      contents: read
      # The called workflow's `deploy` job needs these; a called job can only
      # narrow the caller's token, never widen it, so they are granted here.
      pages: write
      id-token: write
    with:
      # PRs export a dev build (fast smoke); a dispatch with `deploy` exports
      # the production bundle that actually gets deployed to Pages.
      # The non-empty value MUST sit in the `&&` slot: GitHub's `&&` yields the
      # first falsy operand and `||` the first truthy one, so
      # `cond && '' || '--dev'` evaluates to '--dev' on BOTH branches (the empty
      # string is falsy) and would quietly deploy a dev bundle.
      export-args: ${{ !inputs.deploy && '--dev' || '' }}
      deploy: ${{ inputs.deploy == true }}
