name: CI / Web
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Dispatched by cd-release.yml at the `vX.Y.Z` tag. Not `release:
  # published`: a release created with GITHUB_TOKEN never fires it, and an
  # App-created one would also fire it for every `-build.N` pre-release.
  workflow_dispatch:
    inputs:
      deploy:
        description: Export the production bundle and deploy it to Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  web:
    # The called workflow's jobs show as "<this name> / Changes|Build|E2E|Deploy".
    #
    # No `if:` here: the called workflow's Changes job runs the same classifier
    # as ci.yml's checks and skips Build - and with it E2E and Deploy - when no
    # changed file can reach the web export (`web-changed`). The tag's deploy
    # dispatch has no diff base, so the classifier fails open and it always
    # builds. scripts/ci-web-gate.test.mjs holds both.
    name: Web
    uses: blinkbitcoin/shared-workflows/.github/workflows/build-web.yml@99f5f97f31d7f56ce1a7b0af6e04243b11663846 # v0.27.0
    permissions:
      contents: read
      # The called workflow's `deploy` job needs these; a called job can only
      # narrow the caller's token, never widen it, so they are granted here.
      pages: write
      id-token: write
    with:
      # Every export is a production export, PR or deploy. PRs used to export
      # with `--dev` as a faster smoke, which meant the flavour that actually
      # deploys was exercised for the first time at the tag - and failed there
      # (ADR 0015). The dev flag saved seconds; the PR now tests the same kind
      # of bytes the deploy ships, and the tag run is a repeat plus the deploy.
      deploy: ${{ inputs.deploy == true }}
      # A project Pages site is served under `/<repo>/`; a custom domain
      # (EXPO_PUBLIC_WEB_DOMAIN) is served at `/`. app.config.ts turns this into
      # `experiments.baseUrl`. Empty on a PR export, which is served at `/` too.
      base-url: ${{ inputs.deploy && vars.EXPO_PUBLIC_WEB_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
