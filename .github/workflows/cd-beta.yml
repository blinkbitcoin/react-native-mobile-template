name: CD / Beta
# Dispatched by cd-release.yml the moment it cuts the `vX.Y.Z` release
# (not `release: published`: a release created with GITHUB_TOKEN never fires
# that). It never builds: it waits for that exact commit's `cd-internal`
# run to be green and then promotes the binary that run already uploaded, so
# beta ships bytes that were tested on internal.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote (e.g. v1.2.3)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  # A constant group, not one keyed on github.ref: `github.ref` is
  # refs/heads/main on a push or a dispatch and refs/tags/vX.Y.Z on a
  # `release: published` event, so a ref-keyed group put cd-beta in a
  # queue of its own and let it touch a store while cd-internal or a
  # production dispatch was in one. Every workflow that talks to App Store
  # Connect, Play or the update server shares this one queue.
  group: release
  cancel-in-progress: false
jobs:
  # The whole promotion - prepare from the tag (green gate, one dispatch of the
  # internal build when it is missing), the store promotions, the release move,
  # Huawei, the store notes and the beta OTA publish - is shared-workflows'
  # publish-beta.yml. This file keeps the dispatch trigger and the concurrency
  # group above, the permissions, and the secrets.
  beta:
    name: Beta
    uses: blinkbitcoin/shared-workflows/.github/workflows/publish-beta.yml@80e8e0efc4570209de1247ce32ee9c8f102389d2 # v0.27.0
    permissions:
      # `contents: write` for the release; `actions: write` because the green
      # gate runs `gh run list` and, when the build is missing, `gh workflow run`.
      contents: write
      actions: write
    with:
      tag: ${{ inputs.tag }}
      ios-bundle-id: ${{ vars.IOS_BUNDLE_ID }}
      ios-scheme: ${{ vars.IOS_SCHEME }}
      android-package: ${{ vars.ANDROID_PACKAGE }}
      # `build-number-offset` is a `number` input, and an unset repo variable is
      # the empty string, which fails input validation rather than falling back
      # to the pipeline's default. fromJSON turns the fallback into a real number.
      build-number-offset: ${{ fromJSON(vars.BUILD_NUMBER_OFFSET || '1000') }}
      # A promotion must never ship a binary whose own build never went green.
      green-workflow: cd-internal.yml
      store-uploads-enabled: ${{ vars.STORE_UPLOADS_ENABLED == 'true' }}
      testflight-external-group: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
      # `environment-variables` is the only way a caller gets an environment variable into
      # the prebuild, the lanes and the consumer scripts. Non-secret only: the
      # value is a workflow input, unmasked and visible to anyone who can read
      # the run, and build-env.sh refuses a key that looks like a credential.
      environment-variables: >-
        {"APP_VARIANT":"production",
        "OTA_ENABLED":"${{ vars.OTA_ENABLED }}",
        "EXPO_UPDATES_URL":"${{ vars.EXPO_UPDATES_URL }}",
        "EXPO_PUBLIC_API_URL":"${{ vars.EXPO_PUBLIC_API_URL }}",
        "EXPO_PUBLIC_APP_NAME":"${{ vars.EXPO_PUBLIC_APP_NAME }}",
        "EXPO_PUBLIC_WEB_DOMAIN":"${{ vars.EXPO_PUBLIC_WEB_DOMAIN }}",
        "EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE":"${{ vars.EXPO_PUBLIC_ALLOW_INSECURE_WEB_STORAGE || 'false' }}"}
      ota-enabled: ${{ vars.OTA_ENABLED == 'true' }}
      ota-cli-version: ${{ vars.OTA_CLI_VERSION }}
      manifest-url: ${{ vars.EXPO_UPDATES_URL }}
      huawei-uploads-enabled: ${{ vars.HUAWEI_UPLOADS_ENABLED == 'true' }}
      huawei-environment-variables: '{"APP_VARIANT":"production", "HUAWEI_APP_ID": "${{ vars.HUAWEI_APP_ID }}", "HUAWEI_UPLOADS_ENABLED": "${{ vars.HUAWEI_UPLOADS_ENABLED }}", "HUAWEI_SUBMIT_DELAY_SECONDS": "${{ vars.HUAWEI_SUBMIT_DELAY_SECONDS }}", "HUAWEI_FEEDBACK_EMAIL": "${{ vars.HUAWEI_FEEDBACK_EMAIL }}", "HUAWEI_TEST_DAYS": "${{ vars.HUAWEI_TEST_DAYS }}"}'
    secrets:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
      APP_REVIEW_FIRST_NAME: ${{ secrets.APP_REVIEW_FIRST_NAME }}
      APP_REVIEW_LAST_NAME: ${{ secrets.APP_REVIEW_LAST_NAME }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
      APP_REVIEW_NOTES: ${{ secrets.APP_REVIEW_NOTES }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      HUAWEI_CLIENT_ID: ${{ secrets.HUAWEI_CLIENT_ID }}
      HUAWEI_CLIENT_SECRET: ${{ secrets.HUAWEI_CLIENT_SECRET }}
      OTA_PUBLISH_TOKEN: ${{ secrets.OTA_PUBLISH_TOKEN }}
