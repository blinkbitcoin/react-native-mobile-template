# Categories for GitHub's "Generate release notes" button and the PR list it
# renders in the UI. The actual release notes are written by release-please
# from the Conventional Commit messages on main (see docs/release-runbook.md);
# this file only groups PRs by label when someone generates notes by hand.
changelog:
  exclude:
    labels:
      - autorelease: pending
      - autorelease: tagged
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels: ['breaking-change']
    - title: Features
      labels: ['feature', 'enhancement']
    - title: Fixes
      labels: ['bug', 'fix']
    - title: Native, build and release
      labels: ['native', 'release', 'ci']
    - title: Documentation
      labels: ['documentation']
    - title: Dependencies
      labels: ['dependencies']
    - title: Other changes
      labels: ['*']
