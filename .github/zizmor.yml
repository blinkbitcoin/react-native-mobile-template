# zizmor policy. `make check-ci` (and so CI's Tooling job) runs zizmor offline
# at --min-severity medium over .github.
rules:
  # The shared workflows are pinned by commit SHA, so a shared-workflows release
  # reaches CD only through a Dependabot PR whose CI ran it
  # (docs/decisions/0023-cd-verified-before-release.md). Third-party actions
  # stay on tags, which Dependabot moves.
  unpinned-uses:
    config:
      policies:
        blinkbitcoin/shared-workflows/*: hash-pin
        '*': ref-pin
  dangerous-triggers:
    ignore:
      # workflow_run is dangerous when the triggered run checks out and runs
      # code from an untrusted (fork) head. This one is filtered to main, checks
      # nothing out, and only asks the API to re-run a beta run for the same
      # commit.
      - cd-beta-retry.yml
