rules:
  - id: rn-secret-in-async-storage
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A token or key is being written to AsyncStorage, which is unencrypted on
      both platforms. Use expo-secure-store for secrets.
    metadata:
      category: security
      references:
        - https://docs.expo.dev/versions/latest/sdk/securestore/
    patterns:
      - pattern-either:
          - pattern: AsyncStorage.setItem("...", $VALUE)
          - pattern: AsyncStorage.setItem($KEY, $VALUE)
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(token|secret|password|key|credential).*

  - id: rn-cleartext-fetch
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      An http:// network endpoint (fetch/axios/XMLHttpRequest/WebSocket/
      baseURL). Cleartext traffic is blocked by App Transport Security and the
      Android network security config, and leaks in transit. Not matched:
      non-network strings such as an xmlns namespace or schema URI.
    patterns:
      - pattern-either:
          - pattern: fetch($URL, ...)
          - pattern: axios.$METHOD($URL, ...)
          - pattern: axios($URL, ...)
          - pattern: 'axios({ url: $URL, ... })'
          - pattern: $XHR.open($METHOD, $URL, ...)
          - pattern: new WebSocket($URL, ...)
          - pattern: '{ baseURL: $URL, ... }'
          - pattern: '{ url: $URL, ... }'
          - pattern: '{ uri: $URL, ... }'
      - metavariable-regex:
          metavariable: $URL
          regex: (?i)^["']http://(?!localhost|127\.0\.0\.1)[^"']+["']$

  - id: rn-webview-injected-javascript
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      injectedJavaScript runs with the page's privileges. Interpolating a value
      into it is an injection; pass data through postMessage instead.
    patterns:
      - pattern: <$TAG ... injectedJavaScript={`...${$X}...`} ... />
