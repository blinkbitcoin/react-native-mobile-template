# Reasoned ignores for osv-scanner. One entry per advisory: what it is, why it
# cannot be reached from this app, and what should make us look again. An entry
# with no reason is not mergeable (docs/quality.md, "Suppressing something,
# correctly"). These mirror auditConfig.ignoreGhsas in pnpm-workspace.yaml.

[[IgnoredVulns]]
id = "GHSA-w3rx-r6r6-pgpr"
reason = "image-size <=2.0.2 ICNS infinite loop. Reached only by metro at bundle time, over assets already in this repo; the app binary does not ship metro. Blocked from patching by minimumReleaseAge and by metro's ^1.0.2 range. Re-evaluate when an Expo SDK bump moves metro off image-size 1.x."

[[IgnoredVulns]]
id = "GHSA-5p2g-fcmc-qvqq"
reason = "image-size <=2.0.2 JXL/HEIF infinite loop. Same single caller, same reachability argument and same blockers as GHSA-w3rx-r6r6-pgpr; listed separately so a fix for one cannot keep the other suppressed."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
reason = "uuid@7.0.3, CVE-2026-41907, CVSS 7.5 high, affecting v3()/v5()/v6(). Path: expo > @expo/config-plugins > xcode@3.0.1 > uuid@7.0.3; xcode is the only dependent in the tree and hard-pins \"uuid\": \"^7.0.3\". No in-range fix can exist: uuid 7.0.3 (2020) was the last 7.x release ever published, and the patched releases (11.1.1, 12.0.1, 13.0.1) are forced majors past xcode's own range - there is no version to move to without xcode itself changing its dependency. Unreachable: xcode's sole call into this package is uuid.v4() at pbxProject.js:90, invoked during `expo prebuild` on a developer machine or CI runner - never inside the shipped app binary, and never over externally supplied input. The advisory is scoped to v3(), v5() and v6(); v4() is not affected. Re-evaluate if @expo/config-plugins ever moves xcode off the uuid 7.x line, or if xcode starts calling v3()/v5()/v6()."

[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
reason = "decode-uri-component@0.2.2, CVE-2026-45822, CVSS 6.6 medium: a malformed URI component causes a hang or crash - a denial of service, not code execution or data disclosure. Path: expo-router@57.0.21 > query-string@7.1.3 > decode-uri-component@0.2.2; expo-router is the only dependent of query-string, and query-string hard-pins \"decode-uri-component\": \"^0.2.2\". No clean upgrade exists: the fix, 0.5.0, is ESM-only (\"type\": \"module\", no \"main\") while query-string/index.js calls it via require('decode-uri-component'); forcing the override breaks require() resolution and crashes on the first deep link parsed. Every query-string release through the current 9.5.1 still declares \"decode-uri-component\": \"^0.4.1\" and has never adopted 0.5.0. Reachable, and accepted rather than absent: expo-router's build/react-navigation/core/getStateFromPath.js:499 calls queryString.parse(query) on an incoming deep link, and query-string/index.js:233 calls decodeComponent(value) on that same parse path (stringify never touches decode-uri-component). The owner has accepted this as a residual DoS surface reachable through a deep link. Re-evaluate if expo-router moves off query-string@7.x, or if query-string adopts a decode-uri-component release past 0.4.x."

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
reason = "node-forge <=1.4.0, CVE-2026-85393, high, CWE-347: RSA PKCS#1 v1.5 verification accepts extra elements nested in the DigestAlgorithm, so a signature can be forged against a low-exponent key. No fixed release exists (1.4.0 is the newest published). Path: expo > @expo/cli, directly and through @expo/code-signing-certificates@0.0.6; nothing else depends on it. Unreachable from the app: only the Expo CLI loads node-forge, on a developer machine or CI runner, and it verifies only what it produced itself (signStringRSASHA256AndVerify checks its own fresh signature) or a certificate the developer configured. The shipped app checks update signatures with platform crypto in expo-updates' native code, so no attacker-supplied signature reaches node-forge's verify(). Mirrored in auditConfig.ignoreGhsas. Re-evaluate when node-forge publishes a fix past 1.4.0, or if the app starts verifying signatures in JavaScript."

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
reason = "braces@3.0.3, CVE-2026-93687, CVSS 7.5 high, CWE-674: the recursive brace-pattern parser has no depth guard, so a deeply nested pattern under the length limit exhausts the call stack and the Node.js process dies with an uncaught RangeError - a denial of service, not code execution or data disclosure. No fixed release exists: 3.0.3 is the newest braces published and the advisory covers <=3.0.3. Path: braces < micromatch@4.0.8, whose dependents in the lockfile are all build, test and code generation tooling: @expo/metro-file-map and metro-file-map (Metro), @jest/transform, jest-haste-map and jest-message-util (Jest), @graphql-codegen/cli and @graphql-tools/git-loader (GraphQL codegen), @lingui/cli, and fast-glob. None of it is imported by the app's own code and none of it ships in the app binary; it runs on a developer machine or CI runner, over patterns from the repository's own configuration. The worst outcome is a tool process that exits, which a developer or CI job sees at once. Re-evaluate when braces publishes a release past 3.0.3, or if the app starts expanding brace patterns it received from outside at runtime."

[[IgnoredVulns]]
id = "GHSA-7mx3-vvmw-hjmv"
reason = "@graphql-tools/utils@11.2.2, CVE-2026-104852, high, CWE-1321: mergeDeep recursed through inherited properties, so response keys aliased to __proto__ or constructor while merging results from two subschemas overwrite Function.prototype - a denial of service for a stitching or federation gateway. Fixed in 12.0.1, and every 12.x copy in the lockfile is on 12.0.3; the 11.x line has no fixed release (11.2.2 is its newest). Path: graphql-yoga@5.24.1 (the mock API), @graphql-codegen/cli, client-preset, core, plugin-helpers and their siblings, graphql-config, and @graphql-tools/delegate, wrap, executor-http and batch-execute under @graphql-tools/url-loader all declare ^11; every one of them is a devDependency, and `pnpm audit --prod` does not report it. Unreachable from the app: none of it ships in the app binary. The only mergeDeep caller in the tree is @graphql-tools/delegate, reached through url-loader, which codegen.ts never uses because its schema is the local file mocks/schema.graphql; the mock API serves one schema built by makeExecutableSchema, with nothing stitched or merged. Mirrored in auditConfig.ignoreGhsas. Re-evaluate when graphql-yoga and the codegen packages move to ^12.0.1 (@graphql-codegen/cli 7.4.5 already has), or if this repository starts stitching or federating schemas."

[[IgnoredVulns]]
id = "GHSA-hp3w-g68c-fv3c"
reason = "sprintf-js@1.0.3, CVE-2026-97058, CVSS 5.3 medium, CWE-1284: an attacker-controlled format string with a precision past ECMAScript's limits makes toFixed, toExponential or toPrecision throw an uncaught RangeError - a denial of service. No fixed release exists: the advisory covers <=1.1.3 and 1.1.3 is the newest sprintf-js published. Path: babel-plugin-istanbul (Jest coverage) > @istanbuljs/load-nyc-config@1.1.0 > js-yaml@3.15.2 > argparse@1.0.10 > sprintf-js@1.0.3; argparse is its only dependent. Unreachable: js-yaml loads argparse only from its own command-line entry, bin/js-yaml.js, which nothing here runs - load-nyc-config imports the library, not the binary - and even there argparse passes sprintf its own help and error templates, never input from outside. Test tooling on a developer machine or CI runner; none of it ships in the app binary. Moderate, so `pnpm audit --audit-level=high` does not fail on it and it has no auditConfig.ignoreGhsas entry. Re-evaluate when sprintf-js publishes a fix past 1.1.3, or when load-nyc-config moves off js-yaml 3."
