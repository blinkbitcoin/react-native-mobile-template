appId: ${APP_ID}
tags: [smoke]
---
- tapOn:
    id: tab-settings
# `Trigger error` is the last control in DevMenu and Settings is a scrolling
# screen, so on an emulator it starts below the fold and `tapOn` cannot reach
# it - which is why this flow failed the first time it ever ran, with "Element
# not found". Scroll to it rather than assuming a viewport height.
#
# Not a reveal problem: DevMenu renders unconditionally in the development
# variant, which is what CI builds, so the seven-tap gesture on the title is
# not involved here.
- scrollUntilVisible:
    element:
      id: settings-trigger-error
    direction: DOWN
- tapOn:
    id: settings-trigger-error
# Development builds also raise React Native's LogBox overlay on a render error,
# and it swallows taps meant for the app. Dismissing it is a no-op in release
# builds, where LogBox is not bundled.
- tapOn:
    text: '^Dismiss$'
    optional: true
- assertVisible:
    id: error-screen
- tapOn:
    id: error-retry
- tapOn:
    text: '^Dismiss$'
    optional: true
# The error boundary sits in the root layout, so resetting it remounts the
# navigator and the app recovers on the initial route rather than on Settings.
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-screen
