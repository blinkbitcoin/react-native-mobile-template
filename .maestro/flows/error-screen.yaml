appId: ${APP_ID}
tags: [smoke]
---
- tapOn:
    id: tab-settings
# The dev menu carrying `settings-trigger-error` renders only when the app is
# the development variant or the title has been tapped seven times
# (SettingsScreen's TAPS_TO_REVEAL). The E2E build is not that variant, so the
# button did not exist and this flow failed the first time it ever ran. Doing
# the gesture works either way - seven extra taps on a revealed menu just
# increment a counter nothing reads.
- repeat:
    times: 7
    commands:
      - tapOn:
          id: settings-title
- tapOn:
    id: settings-trigger-error
# Development builds also raise React Native's LogBox overlay on a render error,
# and it swallows taps meant for the app. Dismissing it is a no-op in release
# builds, where LogBox is not bundled.
- tapOn:
    text: '^Dismiss$'
    optional: true
- assertVisible:
    id: error-screen
- tapOn:
    id: error-retry
- tapOn:
    text: '^Dismiss$'
    optional: true
# The error boundary sits in the root layout, so resetting it remounts the
# navigator and the app recovers on the initial route rather than on Settings.
- assertVisible:
    id: home-screen
- tapOn:
    id: tab-settings
- assertVisible:
    id: settings-screen
