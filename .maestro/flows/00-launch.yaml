appId: ${APP_ID}
tags: [smoke]
---
# `stopApp: false` (and no `clearState`) on purpose: the runner has already
# foregrounded the app through the `expo-development-client` deep link
# (`scripts/e2e/maestro-{ios,android}.sh` locally, `$WORKFLOWS_DIR/scripts/e2e/app-launch.sh`
# in CI), which is the only reliable way to reach the bundle on a simulator or
# emulator. Restarting or clearing state here would drop the dev client back on
# its launcher screen, whose "DEVELOPMENT SERVERS" list is populated by Bonjour
# discovery — which does not work on a simulator or in CI, so the flow would
# hang there forever.
#
# The whole suite depends on this: every later flow assumes the app is already
# foregrounded on Home, and the only thing that puts it there is the runner's
# deep-link relaunch — never a `clearState` restart from inside a flow, which
# would land on the launcher and strand every flow after this one.
- launchApp:
    stopApp: false
# Belt and braces, all optional and all no-ops on the happy path: React
# Native's LogBox overlay (dev builds only) and, if the dev client did land on
# its launcher anyway, the manual "connect to Metro" taps.
- tapOn:
    text: 'Dismiss'
    optional: true
- runFlow:
    when:
      visible:
        text: 'DEVELOPMENT SERVERS'
    commands:
      # Any port, deliberately: Metro's is derived from APP_PORT_BASE
      # (scripts/ports.mjs) and CI picks its own, so a literal would pin the
      # flow to one worktree. `${METRO_PORT}` is not the answer either - this
      # suite also runs from shared-workflows, which passes only APP_ID,
      # and Maestro aborts a flow on an unresolved variable. The cost, accepted:
      # this tap can no longer tell the right dev server from any dev server. It
      # is `optional: true` and only reached if the dev client landed on its
      # launcher at all, so the blast radius is one fallback tap.
      - tapOn:
          text: 'http://.*:[0-9]+'
          optional: true
      - tapOn:
          text: '^Continue$'
          optional: true
      # `Continue` hands over to the dev menu itself; close it. The close
      # button is an iOS-only SF Symbol (`xmark`); on Android the dev menu is a
      # sheet that the hardware back key dismisses.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: 'xmark'
                optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - back
# `assertVisible` has no `timeout` property in Maestro 2.x; `extendedWaitUntil`
# is the supported way to wait out a cold start.
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 90000
