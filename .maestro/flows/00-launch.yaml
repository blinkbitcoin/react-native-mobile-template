appId: ${APP_ID}
tags: [smoke]
---
# `stopApp: false` (and no `clearState`) on purpose: the runner has already
# foregrounded the app through the `expo-development-client` deep link
# (`scripts/e2e/maestro-{ios,android}.sh` locally, `$WORKFLOWS_DIR/scripts/e2e/app-launch.sh`
# in CI), which is the only reliable way to reach the bundle on a simulator or
# emulator. Restarting or clearing state here would drop the dev client back on
# its launcher screen, whose "DEVELOPMENT SERVERS" list is populated by Bonjour
# discovery — which does not work on a simulator or in CI, so the flow would
# hang there forever.
#
# The whole suite depends on this: every later flow assumes the app is already
# foregrounded on Home, and the only thing that puts it there is the runner's
# deep-link relaunch — never a `clearState` restart from inside a flow, which
# would land on the launcher and strand every flow after this one.
- launchApp:
    stopApp: false
# Belt and braces, all optional and all no-ops on the happy path: React
# Native's LogBox overlay (dev builds only) and, if the dev client did land on
# its launcher anyway, the manual "connect to Metro" taps.
- tapOn:
    text: 'Dismiss'
    optional: true
# iOS asks "Open in <app>?" when a URL arrives from another app. The runner
# foregrounds the app first so the open is not prompted
# (shared-workflows' app-launch.sh), but a simulator that has never been asked
# can still surface it - and unanswered it just sits there. A no-op elsewhere.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: '^Open$'
          optional: true
# The developer menu, not the launcher. expo-dev-client opens it by itself the
# first time a given build runs, which on a fresh emulator is every CI run, and
# it is a sheet over the app: Home renders fine underneath but `home-screen` is
# not visible, so the whole suite failed on a working app. The launcher branch
# below also taps Continue, but only when DEVELOPMENT SERVERS is on screen -
# a different screen from this one, so it never fired here.
- tapOn:
    text: '^Continue$'
    optional: true
# Continue only dismisses the menu's intro page - it hands over to the dev menu
# proper (Reload / Go home / TOOLS), which is still a sheet over the app. That
# close was written, but only inside the launcher branch below, so it never ran
# here: the first fix tapped Continue and then waited 90s on a menu it had just
# paged forward. Close it the same way the branch below does.
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: 'xmark'
          optional: true
- runFlow:
    when:
      visible:
        text: 'DEVELOPMENT SERVERS'
    commands:
      # Any port, deliberately: Metro's is derived from APP_PORT_BASE
      # (scripts/ports.mjs) and CI picks its own, so a literal would pin the
      # flow to one worktree. `${METRO_PORT}` is not the answer either - this
      # suite also runs from shared-workflows, which passes only APP_ID,
      # and Maestro aborts a flow on an unresolved variable. The cost, accepted:
      # this tap can no longer tell the right dev server from any dev server. It
      # is `optional: true` and only reached if the dev client landed on its
      # launcher at all, so the blast radius is one fallback tap.
      - tapOn:
          text: 'http://.*:[0-9]+'
          optional: true
      - tapOn:
          text: '^Continue$'
          optional: true
      # `Continue` hands over to the dev menu itself; close it. The close
      # button is an iOS-only SF Symbol (`xmark`); on Android the dev menu is a
      # sheet that the hardware back key dismisses.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                id: 'xmark'
                optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - back
# `stopApp: false` means this flow can start on whatever screen the previous
# one left behind - `error-screen` ends on Settings - and on a suite retry it
# does. Without this tap the retry fails here on a working app and stacks an
# invented failure on top of the real one, exactly when the signal matters
# most. Optional, so it is a no-op on the cold start it was written for, and
# it is what every other flow already does to reach its own tab.
- runFlow: ../helpers/to-tab-bar.yaml
- tapOn:
    id: tab-home
    optional: true
# `assertVisible` has no `timeout` property in Maestro 2.x; `extendedWaitUntil`
# is the supported way to wait out a cold start.
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 90000
