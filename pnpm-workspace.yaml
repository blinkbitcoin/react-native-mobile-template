# pnpm 10+ reads settings from here. No `packages:` key on purpose: flat repo.
# 1 day in minutes. The guard exists so this repo is never the first installer
# of a compromised release: a hijacked maintainer account publishing a poisoned
# version of a package already trusted here. Those are usually spotted and
# pulled within hours, because popular packages get thousands of installs fast,
# so a cooldown of any length does most of the work - the difference between 1
# and 3 days is small next to the difference between 0 and 1.
#
# It was 3 days, and the cost was a standing conflict with `expo install
# --check` (below): Expo ships patches more often than every three days, so the
# deps gate was red for days at a time on versions this repo had deliberately
# not installed yet. 1 day keeps the canary property and mostly removes that.
#
# What no cooldown catches: a slow-burn handover, where a real maintainer
# passes a package to a bad actor who waits weeks before publishing. That is
# the audit's job, not this one.
minimumReleaseAge: 1440
# Exact versions pinned by `pnpm create expo-app@latest` at bootstrap time
# (2026-09-06). Long past any cooldown now, so these entries no longer do
# anything - they are kept as the worked example of the form: version-pinned
# (not package-name-pinned) so the guard still applies to any future release.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - 'expo@57.0.20'
  - 'expo-modules-core@57.0.16'
  - 'expo-modules-jsi@57.0.8'
  - 'baseline-browser-mapping@2.11.21'
  - 'browserslist@4.28.9'
  - 'electron-to-chromium@1.5.422'
  - 'postcss@8.5.28'
  # Added for Task 6 (Expo Router skeleton): pulled in by
  # `expo install expo-router ...` on 2026-09-06, within the cooldown then in force.
  - 'expo-router@57.0.19'
  - '@expo/ui@57.0.16'
# The recurring case worth naming: `expo install --check` (and expo-doctor's
# version check) demand whatever patch the SDK currently expects, while the
# guard above refuses anything younger than the cooldown. At 3 days the two
# were in permanent conflict - Expo patches more often than that - and the deps
# gate sat red for days on a version this repo had chosen not to install yet.
# At 1 day they still disagreed for a day after every Expo patch, and that day
# turned every open PR red and skipped its unit and E2E jobs. So the drift
# check is advisory now - `scripts/check-deps.sh` prints the table and CI
# annotates a warning - and the guard is the only thing that decides when a
# patch comes in.
#
# Excluding the SDK here would make the guard silent, and that is the trade the
# image-size note below still refuses: a guard waived whenever it is
# inconvenient is not a guard. Shortening the window is a decision about how
# much exposure to accept; an exclude is a decision to stop checking.
strictDepBuilds: true
# Refuses an install where a package's provenance is weaker than the version
# already in the lockfile - an unsigned or unattested republish of something
# that used to be signed. scripts/security/policy.sh asserts this line exists,
# because weakening it is a one-line change that would otherwise pass review.
trustPolicy: no-downgrade
# Reasoned exclusions, name@version so each is pinned to the release actually
# checked rather than open-ended - one per package, in the style of
# ignoreGhsas below. pnpm's trust check compares publish dates across ALL
# majors of a package, not within the installed major line (confirmed:
# https://github.com/orgs/pnpm/discussions/11084, pnpm issue #10202), so an
# old-but-fine release reads as "downgraded" purely because a later major
# started shipping provenance attestation after this one was published.
# `pnpm audit` returns zero advisories for all three - the block is
# provenance-comparison noise, not a vulnerability.
trustPolicyExclude:
  # eslint-plugin-import's peer range still resolves to this 3.x line; the
  # provenance-carrying 4.x line was published later, so pnpm reads that as
  # this release's trust having dropped. Nothing about this specific publish
  # changed.
  - 'eslint-import-resolver-typescript@3.10.1'
  # node-semver's 6.x line, the resolved range for several dependencies here;
  # 7.x gained provenance after 6.3.1 shipped, tripping the same cross-major
  # date comparison. Tracked upstream at pnpm issue #10202.
  - 'semver@6.3.1'
  # Predates npm's provenance requirement; the 2.x line added it later. The
  # real ua-parser-js takeover (2021) was versions 0.7.29/0.8.0/1.0.0, patched
  # years before this release - `pnpm audit` finds nothing against 1.0.41.
  - 'ua-parser-js@1.0.41'
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
allowBuilds:
  '@parcel/watcher': true
  # Added for Task 11 (GraphQL tooling): esbuild's postinstall installs its
  # platform binary (tsx and graphql-codegen depend on it).
  esbuild: true
  lefthook: true
  # msw's postinstall only copies the browser service worker (unused here, we
  # run msw/node), but strictDepBuilds requires an explicit decision.
  msw: true
  unrs-resolver: true
auditConfig:
  # One reasoned entry per advisory - id, the path that pulls it in, why it is
  # unreachable from this app, and what should make us look again. An id with
  # no such comment is not mergeable (docs/quality.md, "Suppressing something,
  # correctly"): a bare list decays into a permanent allowlist nobody dares
  # shorten. Keep each run of comment lines under 32 - pnpm's YAML parser
  # rejects more ("too many consecutive comments"), and that is a parse error.
  #
  # Both ids below are image-size and share one blocker, stated once here.
  # The fix exists upstream and is not installable yet. pnpm's own audit prints
  # `Vulnerable versions <=2.0.2` / `Patched versions >=2.0.3`; the GitHub
  # advisory API agrees on the range (`vulnerable_version_range: "<= 2.0.2"`)
  # while still carrying `first_patched_version: null`, so "no fixed release
  # exists" reads true from GitHub alone and is wrong. 2.0.3 and 2.0.4 were
  # both published 2026-09-14, and two things block an override to ^2.0.4:
  #
  #   1. minimumReleaseAge (above) refuses it - verified, not assumed: pnpm
  #      fails with ERR_PNPM_NO_MATURE_MATCHING_VERSION, "image-size@2.0.4 was
  #      published at 2026-09-14T16:38:44Z, within the minimumReleaseAge
  #      cutoff". The newest version old enough to install is 2.0.2, which is
  #      inside the vulnerable range. Waiving a supply-chain guard to patch a
  #      build-time DoS we cannot reach is the wrong trade.
  #   2. metro@0.87.0 declares `"image-size": "^1.0.2"` - a forced major.
  #
  # Compatibility is not the blocker, so the follow-up is cheap: metro's call
  # shape `(0, interop(require('image-size')).default)(buffer)` works against
  # 2.0.4 (its CJS build sets `__esModule` and a callable `default`) and gives
  # identical width/height for all six files in assets/ under both versions.
  # So from 2026-09-17, when 2.0.4 matures, add `overrides: image-size: ^2.0.4`
  # and delete both ids - or delete them with no override at all once an Expo
  # SDK bump moves metro's own range off image-size 1.x.
  ignoreGhsas:
    # GHSA-w3rx-r6r6-pgpr (CVE-2025-71330, high, CWE-835) - image-size <=2.0.2:
    # an ICNS entry whose length field is 0 never advances the parser's offset,
    # so the while loop spins and the Node event loop is blocked for good.
    #
    # Path: metro@0.87.0 is the only package in this tree that depends on
    # image-size at all (`"image-size": "^1.0.2"`, resolved to 1.2.1), so every
    # path is a different route into the same metro and ends
    # ... > @react-native/community-cli-plugin > @react-native/metro-config >
    # metro-config > metro > image-size. `pnpm audit --prod` prints three of
    # them and then "... Found 100 paths" - 100 is pnpm's display cap, not a
    # count, and the fan-out is expo/react-native re-entering their own graph,
    # not a second dependent. It arrives with react-native's bundler, not with
    # anything this app chose, so there is no direct dependency to move off.
    #
    # Unreachable from app code: the single caller is metro's src/Assets.js
    # (one call, `getImageSize(content)`), reading the dimensions of files
    # already in this repo while building a bundle. Build-time tool, first-party
    # input, developer machine or CI runner - the app binary does not ship
    # metro, and nothing at runtime hands it an attacker-supplied ICNS.
    # Committing a malicious ICNS to hang your own bundler is not a threat
    # model.
    #
    # Re-evaluate: from 2026-09-17 per the override note above. Sooner if metro
    # ever reads images from outside the project tree.
    - GHSA-w3rx-r6r6-pgpr
    # GHSA-5p2g-fcmc-qvqq (CVE-2025-71329, high, CWE-835) - image-size <=2.0.2:
    # the same class of bug in the JXL and HEIF parsers. A box declaring size 0
    # leaves the offset where it was, and the parser loops forever.
    #
    # Path: identical to the entry above - same sole dependent (metro@0.87.0),
    # same resolved image-size@1.2.1, same display-capped path list.
    #
    # Unreachable for the same reason and at the same single call site: metro
    # reads repo assets at bundle time. The two ids are listed separately
    # rather than as "the image-size ones" so a fix landing for one cannot
    # quietly keep the other suppressed - and note the fix here is the same
    # release, so in practice they will be deleted together.
    #
    # Re-evaluate: from 2026-09-17 per the override note above.
    - GHSA-5p2g-fcmc-qvqq

# babel.config.js names `babel-preset-expo`, and @babel/core resolves a preset
# from the config file's own directory -- which pnpm's strict node_modules does
# not expose, because the preset is a transitive dependency of `expo`. Metro's
# transform workers get away with it; the in-process tree-shaking serializer
# that `expo export:embed --minify false` takes does not, and that is exactly
# the path `gradle bundleRelease` uses. Without this, every Android release
# build dies at :app:createBundleReleaseJsAndAssets with
# "Failed to construct transformer: Cannot find module 'babel-preset-expo'".
# The two defaults are repeated because setting the key replaces them.
publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - 'babel-preset-expo'
