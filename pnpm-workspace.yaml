# pnpm 10+ reads settings from here. No `packages:` key on purpose: flat repo.
minimumReleaseAge: 4320   # 3 days in minutes; supply-chain guard
# Exact versions pinned by `pnpm create expo-app@latest` at bootstrap time
# (2026-09-06), published within the 3-day window above. Version-pinned (not
# package-name-pinned) so the guard still applies to any future release.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - 'expo@57.0.20'
  - 'expo-modules-core@57.0.16'
  - 'expo-modules-jsi@57.0.8'
  - 'baseline-browser-mapping@2.11.21'
  - 'browserslist@4.28.9'
  - 'electron-to-chromium@1.5.422'
  - 'postcss@8.5.28'
  # Added for Task 6 (Expo Router skeleton): pulled in by
  # `expo install expo-router ...` on 2026-09-06, within the 3-day window above.
  - 'expo-router@57.0.19'
  - '@expo/ui@57.0.16'
strictDepBuilds: true
onlyBuiltDependencies:
  - '@biomejs/biome'
  - esbuild
  - sharp
allowBuilds:
  '@parcel/watcher': true
  # Added for Task 11 (GraphQL tooling): esbuild's postinstall installs its
  # platform binary (tsx and graphql-codegen depend on it).
  esbuild: true
  lefthook: true
  # msw's postinstall only copies the browser service worker (unused here, we
  # run msw/node), but strictDepBuilds requires an explicit decision.
  msw: true
  unrs-resolver: true
auditConfig:
  # image-size (transitive: metro -> @react-native/metro-config -> metro ->
  # image-size, pulled in by react-native/expo tooling itself, not app code)
  # has two unpatched high-severity DoS advisories (infinite loop parsing
  # malformed ICNS/JXL/HEIF images). No fixed release exists at this Expo SDK
  # 57 line and the app never decodes untrusted image files through this
  # dependency (it's only used by Metro's own asset pipeline at build time).
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
